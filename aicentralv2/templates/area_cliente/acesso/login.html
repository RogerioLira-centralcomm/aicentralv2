{% extends 'area_cliente/acesso/_base.html' %}
{% block title %}Entrar{% endblock %}
{% block content %}
<h1 class="ac-auth__title">Bem-vindo de volta</h1>
<p class="ac-auth__lead">Entre para acompanhar suas campanhas e entregas.</p>
<form class="ac-auth__form" method="post" action="/login" novalidate>
  <input type="hidden" name="next" value="{{ next_target }}">
  <label class="ac-auth__field"><span>E-mail</span><input type="email" name="email" inputmode="email" autocomplete="username" autocapitalize="none" required autofocus value="{{ request.form.get('email', '') }}"></label>
  <label class="ac-auth__field"><span>Senha</span><input type="password" name="password" autocomplete="current-password" required></label>
  <div class="ac-auth__alt"><span></span><a class="ac-link" href="/forgot-password">Esqueci minha senha</a></div>
  <button type="submit" class="ac-btn ac-btn--primary ac-auth__submit">Entrar</button>
</form>
<p class="ac-auth__hint">Ainda não tem acesso? <a class="ac-link" href="/signup">Criar conta</a></p>
{% endblock %}
