<!DOCTYPE html>
<html lang="pt-BR" data-theme="centralcomm">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CentralX - CentralComm{% endblock %}</title>
    
    <!-- Favicon -->
    <link href="https://framerusercontent.com/images/xlKOUeMNrkAUmU4dlKVlbRZc.png" rel="icon" media="(prefers-color-scheme: light)">
    <link href="https://framerusercontent.com/images/xlKOUeMNrkAUmU4dlKVlbRZc.png" rel="icon" media="(prefers-color-scheme: dark)">
    
    <!-- Build local Tailwind 3.4 + DaisyUI 4.12 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind/output.css') }}">
        <script>
            // Aplica o tema salvo (se existir) o mais cedo possível
            (function(){
                try {
                    var saved = localStorage.getItem('theme');
                    if (saved) document.documentElement.setAttribute('data-theme', saved);
                } catch (e) { /* ignore */ }
            })();
        </script>
    
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos CSS customizados -->
    <style>
        :root {
            --color-primary: #1E4D4F;
            --color-primary-light: #2A6D70;
            --color-primary-dark: #153638;
            --color-accent: #9CCF31;
            --color-secondary: #F3B71B;
        }
        
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-slide-up {
            animation: slideUp 0.3s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    
    <!-- Estilos específicos da página -->
    {% block styles %}{% endblock %}
</head>
<body class="bg-base-100 font-sans">
    <!-- Brand / Logo for auth pages -->
    <header class="w-full flex justify-center py-6">
        <a href="{{ url_for('index') }}" class="flex items-center gap-3">
                <img src="{{ url_for('static', filename='images/cc_logo.png') }}" alt="CentralX" class="h-12 w-auto" />
            <div class="leading-tight">
                <h1 class="text-lg font-bold">CentralX</h1>
                <p class="text-xs opacity-60">CentralComm</p>
            </div>
        </a>
    </header>
    
    <!-- Conteúdo principal -->
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <!-- Scripts globais -->
    <script>
        // Função para fechar mensagens flash
        function closeFlashMessage(element) {
            element.parentElement.remove();
        }
    </script>
    
    <!-- Scripts específicos da página -->
    {% block scripts %}{% endblock %}
</body>
</html>
