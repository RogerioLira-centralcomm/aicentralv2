<!DOCTYPE html>
<html lang="pt-BR" data-cadu-theme="light" data-cadu-skin="workspace">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#0b1f1c">
  <title>{% block title %}{{ 'CentralX' if is_centralx_host else 'Cadu Workspace' }}{% endblock %}</title>
  <meta name="robots" content="noindex,follow">
  <link rel="icon" href="{{ url_for('static', filename='images/cc_logo.png' if is_centralx_host else 'images/cadu/products/cadu-icon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750&display=swap" rel="stylesheet">
  {% include 'cadu_workspace/_untitled_styles.html' %}
  <link rel="stylesheet" href="{{ url_for('static', filename='cadu_auth/app.css') }}?v={{ cadu_workspace_asset_version }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/cadu-auth-motion.css') }}?v={{ cadu_workspace_asset_version }}">
</head>
<body>
  <div id="cadu-auth-root"></div>
  <noscript><div class="cadu-auth-noscript"><strong>Ative o JavaScript para continuar.</strong><span>Esta tela de acesso precisa do JavaScript do {{ 'CentralX' if is_centralx_host else 'Cadu Workspace' }}.</span></div></noscript>
  <script id="cadu-auth-bootstrap" type="application/json">{% block auth_bootstrap %}{{ {}|tojson }}{% endblock %}</script>
  <script type="module" src="{{ url_for('static', filename='cadu_auth/app.js') }}?v={{ cadu_workspace_asset_version }}"></script>
</body>
</html>
