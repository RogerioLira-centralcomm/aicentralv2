<!doctype html>
<html lang="pt-BR" data-cadu-theme="light" data-cadu-skin="workspace">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Cadu Media{% endblock %}</title>
  {% block meta %}{% endblock %}
  <link rel="icon" href="{{ url_for('static', filename='images/cadu/products/cadu-icon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750&display=swap" rel="stylesheet">
  {% block styles %}{% endblock %}
</head>
<body class="cadu-public-page">
  <a class="cadu-public-skip" href="#conteudo">Ir para o conteúdo</a>
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
