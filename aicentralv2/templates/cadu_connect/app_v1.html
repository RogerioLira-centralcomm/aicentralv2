{% extends 'cadu_portals/base.html' %}
{% block title %}Reports · Operação de mídia{% endblock %}
{% block product_id %}connect{% endblock %}
{% block styles %}<link rel="stylesheet" href="{{ url_for('static', filename='cadu_connect/react/app.css') }}?v={{ cadu_workspace_asset_version }}">{% endblock %}
{% block navigation %}{% endblock %}
{% block content %}<div id="cadu-reports-v1-root" data-workspace-url="{{ product_url('workspace', '/workspace/app') }}" data-planner-url="{{ product_url('planner', '/') }}" data-studio-url="{{ product_url('studio', '/') }}" data-skills-url="{{ product_url('skills', '/') }}" data-credits-url="{{ product_url('workspace', '/workspace/app/creditos') }}" data-profile-url="{{ product_url('workspace', '/workspace/app/conta?section=perfil') }}" data-user-name="{{ session.get('user_name', 'Minha conta')|e }}" data-user-avatar="{{ session.get('user_photo_url') or ('/static/images/cadu/avatars/' ~ session.get('cadu_avatar_badge')) if session.get('cadu_avatar_badge') else session.get('user_photo_url', '') }}"></div>{% endblock %}
{% block portal_scripts %}<script defer src="{{ url_for('static', filename='js/vendor/apexcharts.min.js') }}"></script><script type="module" src="{{ url_for('static', filename='cadu_connect/react/app.js') }}?v={{ cadu_workspace_asset_version }}"></script>{% endblock %}
