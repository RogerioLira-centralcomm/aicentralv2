{% if sub_status_atual|string in ['1', '2', '3'] %}
{% set campanhas_sempre_abertas = false %}
<tr class="collapse-camp-row hidden" id="camp-collapse-{{ pi.id_pi }}"{% if origem_lista == 'nf_emitida' %} data-nf-group-item="{{ grupo.key }}"{% endif %}>
  <td colspan="7">
    <section class="pi-camp-block" aria-label="Campanhas do PI {{ pi.codigo_pi_cc or pi.codigo_pi_ag or pi.id_pi }}">
      <header class="pi-camp-block__header">
        <strong>Campanhas vinculadas</strong>
        <span>{{ pi.get('total_campanhas', 0) }} campanha{% if pi.get('total_campanhas', 0) != 1 %}s{% endif %}</span>
      </header>
      <div id="camp-content-{{ pi.id_pi }}" class="pi-campaign-loading" role="status" aria-live="polite">
        <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
        <span>Carregando campanhas</span>
      </div>
    </section>
  </td>
</tr>
{% endif %}
