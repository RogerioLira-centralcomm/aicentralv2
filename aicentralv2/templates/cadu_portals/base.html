<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Cadu{% endblock %}</title>
  {% block meta %}{% endblock %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/cadu-portals.css') }}?v=2">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/cadu-product-switch.css') }}?v=2">
  {% block styles %}{% endblock %}
</head>
<body class="portal portal--{% block product_id %}cadu{% endblock %}">
  <a class="portal-skip" href="#content">Ir para o conteúdo</a>
  {% block navigation %}{% set cadu_active_product = self.product_id()|trim %}{% include 'cadu/_product_nav.html' %}{% endblock %}
  <main id="content" tabindex="-1">{% block content %}{% endblock %}</main>
</body>
</html>
