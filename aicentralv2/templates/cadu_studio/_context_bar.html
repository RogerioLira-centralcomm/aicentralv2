{% set mc_page = mc_page|default('hub') %}
<header class="mc-cadu-bar mc-cadu-bar--studio" id="mcCaduBar">
  {% set cadu_active_product = 'studio' %}{% include 'cadu/_product_switch.html' %}
  <span class="mc-studio-divider" aria-hidden="true"></span>
  <nav class="mc-cadu-nav" aria-label="Navegação do Studio"><a href="{{ url_for('parametros.modelagem_criativos') }}"{% if mc_page == 'hub' %} class="is-current" aria-current="page"{% endif %}>Visão geral</a><a id="mcCaduStill" href="{{ url_for('parametros.modelagem_trocar') }}"{% if mc_page == 'trocar' %} class="is-current" aria-current="page"{% endif %}>Ajustar</a><a id="mcCaduVideo" href="{{ url_for('parametros.modelagem_video') }}"{% if mc_page == 'video' %} class="is-current" aria-current="page"{% endif %}>Vídeo</a><a class="mc-cadu-dsa-link" href="{{ url_for('parametros.modelagem_design-system') }}"{% if mc_page == 'design-system' %} aria-current="page"{% endif %}>Design System Ads</a></nav>
  <div class="mc-cadu-meta"><label class="mc-cadu-brand"><span class="mc-cadu-brand-label">Marca</span><select id="mcCaduBarClient" aria-label="Marca desta sessão"><option value="">Marca</option></select></label><p class="mc-cadu-credits" id="mcCaduCredits" hidden></p><a class="mc-studio-account" href="{{ product_url('workspace', '/familia/workspace/perfil') }}" aria-label="Abrir perfil">{{ session.get('user_name', 'U')[:2] | upper }}</a></div>
</header>
<div id="mcPageAlert" class="cx-alert cx-alert-danger hidden" role="alert"></div>
