{% extends "cadu_portals/base.html" %}
{% block title %}Cadu Studio — Início{% endblock %}
{% block product_id %}studio{% endblock %}
{% block navigation %}{% endblock %}
{% block styles %}<link rel="stylesheet" href="{{ url_for('static', filename='cadu_studio/home/react/app.css') }}?v={{ static_fingerprint('cadu_studio/home/react/app.css') if static_fingerprint is defined else 0 }}">{% endblock %}
{% block content %}
<div id="cadu-studio-home-root"><noscript>Ative o JavaScript para usar o Cadu Studio.</noscript></div>
<script id="cadu-studio-home-bootstrap" type="application/json">{{ {
  'apiRoot': '/studio/api',
  'csrf': mc_trocr_csrf,
  'projectId': request.args.get('project_id') or (session.get('workspace_recent_project_ids') or [''])[0],
  'creditSummaryUrl': '/workspace/api/creditos/resumo',
  'user': {'name': session.get('user_name', 'Minha conta'), 'email': session.get('user_email', ''), 'avatar': (perfil_contato or {}).get('foto_url') or session.get('user_photo_url', '')},
  'links': {
    'home': studio_url('modelagem_criativos'),
    'create': studio_url('modelagem_criar'),
    'editor': studio_url('modelagem_trocar'),
    'videos': studio_url('modelagem_video'),
    'audio': product_url('studio', '/audio'),
    'analyzer': product_url('studio', '/analyzer'),
    'library': product_url('studio', '/biblioteca'),
    'lab': product_url('studio', '/lab') if studio_lab_enabled is defined and studio_lab_enabled() else None,
    'credits': product_url('workspace', '/workspace/app/creditos'),
    'profile': product_url('workspace', '/workspace/app/conta?section=perfil'),
    'workspace': product_url('workspace', '/workspace/app'),
    'logout': product_url('auth', '/logout'),
    'products': {'workspace': product_url('workspace', '/workspace/app'), 'planner': product_url('planner', '/'), 'studio': product_url('studio', '/'),
                 'connect': product_url('connect', '/connect/app'), 'skills': None}
  }
}|tojson }}</script>
{% endblock %}
{% block portal_scripts %}<script type="module" src="{{ url_for('static', filename='cadu_studio/home/react/app.js') }}?v={{ static_fingerprint('cadu_studio/home/react/app.js') if static_fingerprint is defined else 0 }}"></script>{% endblock %}
