<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Acompanhamento da campanha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<!--
  Página da campanha · template operacional Centralcomm

  Uma página por PI, enviada a todos os contatos do cliente/parceiro.
  Começa só com a timeline e vai ganhando módulos conforme os marcos são concluídos.

  Como operar:
  1. Edite apenas o objeto CAMPANHA no <script> do fim do arquivo.
  2. Ao concluir um marco, preencha `realizado` com a data (AAAA-MM-DD).
  3. Cada módulo tem `aparece_apos`: o id do marco que o libera. Concluiu o marco, o módulo aparece.
  4. Dashboard de entregas (Looker Studio): no relatório, Arquivo › Incorporar relatório ›
     ativar incorporação › copiar o link "Incorporar URL" (lookerstudio.google.com/embed/reporting/...).
     O compartilhamento precisa permitir leitura para quem tem o link (ou para os e-mails do cliente).
  5. Antes de enviar ao cliente: `demo: false`.
-->
<style>
  :root {
    --bg: #F2F4F3;
    --surface: #FFFFFF;
    --ink: #15212A;
    --muted: #55646E;
    --line: #D0D9DB;
    --accent: #0D6A6E;
    --accent-soft: #DDEDEC;
    --warn: #9A5B0B;
    --warn-soft: #FAEDD6;
    --stop: #B3261E;
    --stop-soft: #F8E1DF;
    --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --cond: "IBM Plex Sans Condensed", "Arial Narrow", "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;              /* página sempre em modo claro */
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
  }
  .wrap {
    max-width: 1240px;
    margin: 0 auto;
    padding: 32px 20px 64px;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 32px;
  }
  .wrap > * { min-width: 0; }
  h1, h2, h3 { font-family: var(--cond); font-weight: 600; text-wrap: balance; margin: 0; }
  h1 { font-size: clamp(26px, 4vw, 36px); line-height: 1.1; letter-spacing: -0.01em; }
  h2 { font-size: 22px; line-height: 1.2; }
  p { margin: 0; }
  a { color: var(--accent); }
  .mono { font-family: var(--mono); }
  .eyebrow {
    font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
  }
  .muted { color: var(--muted); }

  /* Cabeçalho */
  .masthead { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-end; justify-content: space-between; }
  .masthead .id { display: grid; gap: 8px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 13px; color: var(--muted); }
  .meta b { font-weight: 500; color: var(--ink); }

  /* Status atual, estilo rastreio */
  .status {
    display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center;
    padding: 16px 20px; border: 1px solid var(--line); border-radius: 10px 10px 0 0; border-bottom: 0;
    background: var(--surface);
  }
  .status .now { display: flex; align-items: center; gap: 10px; font-family: var(--cond); font-size: 19px; font-weight: 600; }
  .status .item { font-size: 13px; color: var(--muted); }
  .status .item b { color: var(--ink); font-weight: 500; }
  .status .bar { flex: 1 1 160px; min-width: 120px; height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; }
  .status .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

  /* Timeline horizontal */
  .timeline {
    border: 1px solid var(--line); border-radius: 0 0 10px 10px; background: var(--surface);
    overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: thin;
  }
  .track {
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(132px, 1fr);
    list-style: none; margin: 0; padding: 20px 8px 22px;
  }
  .step { position: relative; padding: 0 10px; scroll-snap-align: start; display: grid; gap: 6px; align-content: start; }
  .step .date { font: 500 12px var(--mono); color: var(--muted); height: 18px; white-space: nowrap; }
  .step .node { position: relative; height: 22px; display: flex; align-items: center; }
  .step .node::after {
    content: ""; position: absolute; left: 22px; right: -10px; top: 50%; height: 2px; transform: translateY(-50%);
    background: var(--line);
  }
  .step:last-child .node::after { display: none; }
  .step.done .node::after { background: var(--accent); }
  .dot {
    position: relative; z-index: 1; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--line); background: var(--surface);
    display: grid; place-items: center; color: var(--surface); font-size: 12px; line-height: 1;
  }
  .step.done .dot { background: var(--accent); border-color: var(--accent); }
  .step.current .dot { border-color: var(--accent); }
  .step.current .dot::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .step.late .dot { border-color: var(--stop); }
  .step.late .dot::before { background: var(--stop); }
  .step .label { font-weight: 500; font-size: 14px; line-height: 1.3; }
  .step.todo .label { color: var(--muted); }
  .step .sub { font-size: 12px; color: var(--muted); line-height: 1.4; }

  .chip { display: inline-flex; align-items: center; font: 500 11px var(--mono); padding: 2px 7px; border-radius: 4px; white-space: nowrap; justify-self: start; }
  .chip.cc { background: var(--accent-soft); color: var(--accent); }
  .chip.cli { background: var(--warn-soft); color: var(--warn); }
  .chip.late { background: var(--stop-soft); color: var(--stop); }

  /* Módulos */
  .module { display: grid; gap: 14px; animation: enter .4s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .module-head { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between; }
  .module-head .muted { font-size: 13px; }
  .card { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 18px 20px; }

  .embed { position: relative; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; aspect-ratio: 16 / 10; min-height: 420px; }
  .embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .dash-open { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
  .dash-open p { margin: 0; font-size: 14px; max-width: 52ch; }
  .dash-open a.btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 8px;
    background: var(--accent); color: var(--surface); font-weight: 600; text-decoration: none; white-space: nowrap;
  }
  .dash-open a.btn:hover { filter: brightness(1.05); }
  .dash-hint { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.45; }
  .embed .ph { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr; gap: 16px; padding: 20px; }
  .ph .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .ph .kpis div, .ph .chart { border-radius: 8px; background: var(--accent-soft); opacity: .7; }
  .ph .kpis div { height: 72px; }
  .ph .note { position: absolute; inset: auto 20px 20px auto; font: 500 12px var(--mono); color: var(--muted); background: var(--surface); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--line); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .kv { display: grid; gap: 2px; }
  .kv dt { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .kv dd { margin: 0; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .people { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .people li { display: grid; gap: 0; }
  .people .role { font-size: 12px; color: var(--muted); }
  .links { list-style: none; margin: 0; padding: 0; display: grid; }
  .links li { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-top: 1px solid var(--line); }
  .links li:first-child { border-top: 0; padding-top: 0; }
  .links .when { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }

  .chat { display: flex; gap: 10px; }
  .chat input { flex: 1; min-width: 0; font: 15px var(--sans); padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  .chat button { font: 500 14px var(--sans); padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--surface); }
  .chat :disabled { opacity: .55; cursor: not-allowed; }

  footer { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }

  /* Barra de demonstração: some com demo:false */
  .demo { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 14px; border: 1px dashed var(--warn); border-radius: 8px; background: var(--warn-soft); font-size: 13px; color: var(--warn); }
  .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; padding: 3px; background: var(--surface); }
  .seg button { font: 500 13px var(--sans); color: var(--muted); background: transparent; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 600px) {
    .wrap { padding: 20px 16px 48px; gap: 24px; }
    .status { padding: 14px 16px; }
    .embed { aspect-ratio: auto; height: 520px; min-height: 0; }
  }
</style>
</head>
<body>
<main class="wrap">
  <div id="demo"></div>
  <header class="masthead" id="masthead"></header>
  <section aria-label="Timeline da campanha">
    <div class="status" id="status"></div>
    <div class="timeline" id="timeline"><ol class="track" id="track"></ol></div>
  </section>
  <div id="modules" style="display:grid; gap:32px; min-width:0"></div>
  <footer id="footer"></footer>
</main>

<script>
const CAMPANHA = {{ campanha|tojson }};

/* ================================================================
   Renderização. Não precisa editar abaixo desta linha.
   ================================================================ */
const ORDEM_MODULOS = ["dashboard", "relatorios", "combinados", "contatos", "documentos", "assistente"];
const RESP = { cc: ["Centralcomm", "cc"], cliente: ["Cliente", "cli"] };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const d = iso => iso ? new Date(iso + "T12:00:00") : null;
const fmt = iso => iso ? d(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) : "";
const fmtLong = iso => iso ? d(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" }).replace(".", "") : "";

// Fases de demonstração: quantos marcos estão concluídos e se o assistente aparece.
const DEMO_FASES = [
  { rotulo: "Dados atuais",            ao_vivo: true },
  { rotulo: "1 · PI aprovado",         concluidos: 1 },
  { rotulo: "2 · Dashboard",           concluidos: 4 },
  { rotulo: "3 · No ar",               concluidos: 5 },
  { rotulo: "4 · Prestação de contas", concluidos: 7 },
  { rotulo: "5 · Faturado",            concluidos: 8 },
  { rotulo: "Futuro: IA",              concluidos: 5, ia: true }
];

function render(cfg) {
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const marcos = cfg.marcos;
  const feitos = new Set(marcos.filter(m => m.realizado).map(m => m.id));
  const atualIdx = marcos.findIndex(m => !m.realizado);
  const atual = atualIdx >= 0 ? marcos[atualIdx] : null;

  document.getElementById("masthead").innerHTML = `
    <div class="id">
      <span class="eyebrow">Acompanhamento de campanha · Centralcomm</span>
      <h1>${esc(cfg.campanha)}</h1>
      <div class="meta">
        <span><b>${esc(cfg.cliente)}</b></span>
        <span class="mono">${esc(cfg.pi)}</span>
        <span>Veiculação <b>${fmtLong(cfg.periodo.inicio)} a ${fmtLong(cfg.periodo.fim)}</b></span>
      </div>
    </div>`;

  // Status, estilo rastreio de entrega
  const pct = Math.round(feitos.size / marcos.length * 100);
  const atrasado = atual && d(atual.previsto) < hoje;
  document.getElementById("status").innerHTML = atual ? `
    <div class="now"><span class="pulse" aria-hidden="true"></span>${esc(atual.titulo)}</div>
    <div class="item">Previsto <b class="mono">${fmt(atual.previsto)}</b>${atrasado ? ' <span class="chip late">atrasado</span>' : ""}</div>
    <div class="item">Com <b>${RESP[atual.responsavel][0]}</b></div>
    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso"><i style="width:${pct}%"></i></div>
    <div class="item mono">${feitos.size}/${marcos.length}</div>`
    : `<div class="now">Campanha concluída</div><div class="bar"><i style="width:100%"></i></div>`;

  document.getElementById("track").innerHTML = marcos.map((m, i) => {
    const done = !!m.realizado, cur = i === atualIdx;
    const late = !done && d(m.previsto) < hoje;
    const cls = done ? "done" : cur ? "current" + (late ? " late" : "") : "todo" + (late ? " late" : "");
    const [rNome, rCls] = RESP[m.responsavel];
    const quando = done ? `✓ ${fmt(m.realizado)}` : `prev. ${fmt(m.previsto)}`;
    return `<li class="step ${cls}" ${cur ? 'aria-current="step"' : ""}>
      <span class="date">${quando}</span>
      <span class="node"><span class="dot" aria-hidden="true">${done ? "✓" : ""}</span></span>
      <span class="label">${esc(m.titulo)}</span>
      <span class="sub">${esc(m.nota)}</span>
      <span class="chip ${rCls}">${rNome}</span>
    </li>`;
  }).join("");

  // Módulos liberados pelos marcos concluídos
  const liberado = (k, mod) => {
    if (!mod || mod.ativo === false) return false;
    if (k === "dashboard" && (mod.url_embed || mod.url_abrir)) return true;
    return feitos.has(mod.aparece_apos);
  };
  document.getElementById("modules").innerHTML = ORDEM_MODULOS
    .filter(k => liberado(k, cfg.modulos[k]))
    .map(k => MODULOS[k](cfg.modulos[k], cfg, feitos)).join("");

  document.getElementById("footer").innerHTML = `
    <span>Atualizado em ${fmtLong(cfg.atualizado_em)}</span>
    <span>Dúvidas: responda ao e-mail do grupo da campanha.</span>`;

  // Em telas estreitas, rola a timeline até o marco atual, deixando o anterior visível
  const el = document.querySelector('.step[aria-current="step"]');
  const tl = document.getElementById("timeline");
  if (el) tl.scrollLeft = Math.max(0, el.offsetLeft - el.clientWidth - 8);
}

const head = (titulo, extra = "") => `<div class="module-head"><h2>${esc(titulo)}</h2>${extra ? `<span class="muted">${extra}</span>` : ""}</div>`;

const MODULOS = {
  dashboard: m => {
    const abrir = m.url_abrir || m.url_embed;
    const card = abrir ? `<div class="card dash-open">
      <div><p><strong>Acesse o relatório no Looker Studio.</strong> Use o botão ao lado (login Google, se solicitado).</p>
      ${m.url_embed ? `<p class="dash-hint" style="margin-top:8px">Se a área abaixo mostrar que a incorporação foi desativada, o relatório ainda abre normalmente pelo botão.</p>` : ""}
      </div>
      <a class="btn" href="${esc(abrir)}" target="_blank" rel="noopener">Abrir dashboard</a>
    </div>` : "";
    const embed = m.url_embed
      ? `<div class="embed" style="margin-top:12px"><iframe src="${esc(m.url_embed)}" title="${esc(m.titulo)}" loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"
           allow="fullscreen; encrypted-media"
           sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-forms allow-presentation"></iframe></div>`
      : (abrir ? `<p class="dash-hint">Visualização incorporada indisponível até a operação ativar <em>Incorporar relatório</em> no Looker Studio.</p>`
        : `<div class="embed"><div class="ph" aria-hidden="true"><div class="kpis"><div></div><div></div><div></div><div></div></div><div class="chart"></div></div>
         <span class="note">Looker Studio · informe o link no cadastro da campanha</span></div>`);
    return `<section class="module">${head(m.titulo, esc(m.descricao))}${card}${embed}</section>`;
  },

  relatorios: (m, cfg, feitos) => {
    const itens = m.itens.filter(r => !r.marco || feitos.has(r.marco));
    return `<section class="module">${head(m.titulo)}
      <div class="card"><ul class="links">${itens.map(r =>
        `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.titulo)}</a><span class="when">${fmt(r.data)}</span></li>`).join("")}
      </ul></div></section>`;
  },

  combinados: m => {
    const kv = itens => `<dl class="grid" style="margin:12px 0 0">${itens.map(c =>
      `<div class="kv"><dt>${esc(c.rotulo)}</dt><dd>${esc(c.valor)}</dd></div>`).join("")}</dl>`;
    return `<section class="module">${head(m.titulo, "Conforme o PI")}
      <div class="card"><span class="eyebrow">PI · geral</span>${kv(m.pi)}</div>
      <div class="two">${m.campanhas.map(c =>
        `<div class="card"><span class="eyebrow">${esc(c.nome)}</span>${kv(c.itens)}</div>`).join("")}</div>
    </section>`;
  },

  contatos: m => {
    const lista = (nome, ps) => `<div class="card"><span class="eyebrow">${nome}</span><ul class="people" style="margin-top:12px">${ps.map(p =>
      `<li><span>${esc(p.nome)}</span><span class="role">${esc(p.papel)} · <a href="mailto:${esc(p.email)}">${esc(p.email)}</a></span></li>`).join("")}</ul></div>`;
    return `<section class="module">${head(m.titulo)}<div class="two">${lista("Centralcomm", m.centralcomm)}${lista("Cliente", m.cliente)}</div></section>`;
  },

  documentos: m => `<section class="module">${head(m.titulo)}
    <div class="card"><ul class="links">${m.itens.map(r =>
      `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.titulo)}</a><span class="when">${fmt(r.data)}</span></li>`).join("")}
    </ul></div></section>`,

  assistente: m => `<section class="module">${head(m.titulo, esc(m.descricao))}
    <div class="card"><form class="chat" onsubmit="return false">
      <input type="text" placeholder="Ex.: quanto já foi entregue nesta semana?" disabled aria-label="Pergunta">
      <button disabled>Perguntar</button>
    </form></div></section>`
};

// Barra de fases: simula marcos concluídos (operacional / prévia)
function initBarraFases(cfg) {
  const box = document.getElementById("demo");
  box.className = "demo";
  box.innerHTML = `<span>Ver a página na fase:</span><div class="seg" role="group" aria-label="Fase da campanha">${DEMO_FASES.map((f, i) =>
    `<button type="button" data-i="${i}" aria-pressed="false">${f.rotulo}</button>`).join("")}</div>`;
  const aplicar = i => {
    const f = DEMO_FASES[i];
    box.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.i == i));
    if (f.ao_vivo) {
      render(cfg);
      return;
    }
    const c = structuredClone(cfg);
    c.marcos.forEach((m, j) => { m.realizado = j < f.concluidos ? (m.realizado || m.previsto) : ""; });
    c.modulos.assistente.ativo = !!f.ia;
    render(c);
  };
  box.addEventListener("click", e => { const b = e.target.closest("button"); if (b) aplicar(+b.dataset.i); });
  aplicar(0);
}
{% if mostrar_barra_fases %}
initBarraFases(CAMPANHA);
{% else %}
document.getElementById("demo").hidden = true;
render(CAMPANHA);
{% endif %}
</script>
</body>
</html>
