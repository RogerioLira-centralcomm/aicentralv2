<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>product_hero</title>
  <style>
    @font-face {
      font-family: "ComposeSans";
      src: url("{{ font_url }}") format("truetype");
      font-display: block;
    }
    html, body {
      margin: 0;
      width: {{ width }}px;
      height: {{ height }}px;
      overflow: hidden;
      background: {{ brand_color }};
    }
    .ad {
      position: relative;
      width: {{ width }}px;
      height: {{ height }}px;
      color: #fff;
      font-family: "ComposeSans", "Open Sans", sans-serif;
      background: {{ brand_color }};
    }
    .visual {
      position: absolute;
      inset: 0;
    }
    .visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .logo {
      position: absolute;
      top: 5%;
      left: 6%;
      width: 14%;
      max-height: 12%;
      object-fit: contain;
    }
    .band {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      gap: {{ cta_gap }}px;
      padding: 6% 7% 8%;
      background: linear-gradient(180deg, transparent, color-mix(in srgb, {{ brand_color }} 88%, #000 12%));
    }
    .headline {
      margin: 0;
      font-size: {{ headline_font_size }}px;
      font-weight: 700;
      line-height: 1.12;
    }
    .cta {
      margin: 0;
      width: max-content;
      padding: 8px 14px;
      background: #fff;
      color: {{ brand_color }};
      font-size: clamp(13px, 2vw, 20px);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  {% set family = family or 'story_9x16' %}
  {% include 'mapped_slots.html' %}
  {% if not regions %}
  <article class="ad" data-family="{{ family }}" data-template="product-hero">
    <div class="visual">{% if still_url %}<img src="{{ still_url }}" alt="">{% endif %}</div>
    {% if logo_url %}<img class="logo" src="{{ logo_url }}" alt="">{% endif %}
    <div class="band">
      <p class="headline">{{ headline }}</p>
      {% if cta %}<p class="cta">{{ cta }}</p>{% endif %}
    </div>
  </article>
  {% endif %}
</body>
</html>
