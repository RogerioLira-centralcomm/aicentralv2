<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>sequence_16x9</title>
  <style>
    @font-face {
      font-family: "ComposeSans";
      src: url("{{ font_url }}") format("truetype");
      font-display: block;
    }
    html, body {
      margin: 0;
      width: {{ width }}px;
      height: {{ height }}px;
      overflow: hidden;
      background: #000;
    }
    .ad {
      position: relative;
      width: {{ width }}px;
      height: {{ height }}px;
      color: #fff;
      font-family: "ComposeSans", "Open Sans", sans-serif;
      background: #000;
    }
    .visual {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .logo {
      position: absolute;
      left: 6%;
      top: 8%;
      width: 72px;
      height: 72px;
      object-fit: contain;
    }
    .headline {
      position: absolute;
      left: 6%;
      top: 68%;
      width: 48%;
      height: 16%;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      text-align: left;
      padding: 0 1.5% 1% 0;
      box-sizing: border-box;
      font-size: clamp(28px, 3.4vw, 54px);
      font-weight: 700;
      line-height: 1.12;
      overflow: hidden;
    }
    .legal {
      position: absolute;
      left: 6%;
      top: 85%;
      width: 48%;
      height: 6%;
      display: flex;
      align-items: flex-start;
      font-size: clamp(12px, 1.1vw, 18px);
      line-height: 1.25;
      opacity: 0.82;
      overflow: hidden;
    }
    .cta {
      position: absolute;
      left: 72%;
      top: 74%;
      width: 20%;
      height: 12%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-sizing: border-box;
      padding: 0 4%;
      background: {{ brand_color }};
      font-size: clamp(16px, 1.6vw, 28px);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <article class="ad" data-family="sequence_16x9">
    <div class="visual">{% if still_url %}<img src="{{ still_url }}" alt="">{% endif %}</div>
    {% if logo_url %}<img class="logo" src="{{ logo_url }}" alt="">{% endif %}
    <p class="headline">{{ headline }}</p>
    {% if legal %}<p class="legal">{{ legal }}</p>{% endif %}
    {% if cta %}<p class="cta">{{ cta }}</p>{% endif %}
  </article>
</body>
</html>
