<dialog id="modal-contato" class="cx-modal-shell">
    <div class="cx-modal-panel w-11/12 max-w-3xl bg-white p-0 rounded-lg">
        <div class="flex items-center justify-between p-4 border-b">
            <h3 class="font-bold text-lg" id="modal-contato-nome">Contato</h3>
            <form method="dialog"><button class="cx-btn cx-btn-sm cx-btn-icon cx-btn-ghost">✕</button></form>
        </div>

        <div class="crm-tabs crm-tabs-bordered w-full px-4 pt-2">
            <a class="crm-tab crm-tab-active" data-modal-tab="dados">Dados</a>
            <a class="crm-tab" data-modal-tab="comunicacao">Gerar mensagem (IA)</a>
            <a class="crm-tab" data-modal-tab="editar">Editar</a>
        </div>

        <!-- Tab: Dados -->
        <div class="p-4" id="tab-dados">
            <div class="grid grid-cols-2 gap-3 mb-4" id="contato-info"></div>
            <h4 class="text-sm font-semibold mb-2">Atividades com este contato</h4>
            <div class="max-h-48 overflow-y-auto" id="contato-atividades-lista"></div>
        </div>

        <!-- Tab: Comunicação IA -->
        <div class="p-4 hidden" id="tab-comunicacao">
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div>
                    <label class="cx-label text-xs">Tipo</label>
                    <div class="flex gap-2">
                        <label class="crm-radio-label cursor-pointer gap-1">
                            <input type="radio" name="com-tipo" value="whatsapp" class="crm-radio" checked />
                            <span class="cx-label text-xs">WhatsApp</span>
                        </label>
                        <label class="crm-radio-label cursor-pointer gap-1">
                            <input type="radio" name="com-tipo" value="email" class="crm-radio" />
                            <span class="cx-label text-xs">Email</span>
                        </label>
                    </div>
                </div>
                <div>
                    <label class="cx-label text-xs">Tamanho</label>
                    <div class="flex gap-2">
                        <label class="crm-radio-label cursor-pointer gap-1">
                            <input type="radio" name="com-tamanho" value="curto" class="crm-radio" />
                            <span class="cx-label text-xs">Curto</span>
                        </label>
                        <label class="crm-radio-label cursor-pointer gap-1">
                            <input type="radio" name="com-tamanho" value="medio" class="crm-radio" checked />
                            <span class="cx-label text-xs">Médio</span>
                        </label>
                        <label class="crm-radio-label cursor-pointer gap-1">
                            <input type="radio" name="com-tamanho" value="longo" class="crm-radio" />
                            <span class="cx-label text-xs">Longo</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="cx-label text-xs">Objetivo da mensagem</label>
                <textarea id="com-objetivo" class="cx-textarea cx-textarea-sm w-full" rows="2"
                          placeholder="Ex: retomar contato e apresentar CTV"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-3">
                <div>
                    <label class="cx-label text-xs">Produto</label>
                    <select id="com-produto"
                            class="text-sm bg-gray-50 border border-gray-200 rounded px-3 py-1.5 text-gray-700 focus:outline-none focus:border-gray-400 appearance-none w-full">
                        <option value="">Nenhum</option>
                        <option value="programatica">Mídia Programática</option>
                        <option value="interativos">Formatos Interativos</option>
                        <option value="serasa_ads">Serasa Ads</option>
                        <option value="cadu">Cadu (SaaS)</option>
                        <option value="ctv">CTV</option>
                        <option value="audio">Áudio Digital</option>
                        <option value="portais">Mídia em Portais</option>
                        <option value="performance">Performance</option>
                    </select>
                </div>
                <div>
                    <label class="cx-label text-xs">Canal / Audiência</label>
                    <input type="text" id="com-canal" class="cx-input cx-input-sm w-full"
                           placeholder="Opcional" />
                </div>
            </div>

            <button id="btn-gerar-comunicacao" class="cx-btn cx-btn-sm cx-btn-primary w-full mb-3">
                Gerar com IA
            </button>

            <div id="com-preview" class="hidden">
                <div class="bg-gray-100 rounded-lg p-3 mb-3 whitespace-pre-wrap text-sm" id="com-texto"></div>
                <div class="flex gap-2 flex-wrap">
                    <button class="cx-btn cx-btn-sm cx-btn-outline" id="btn-copiar">Copiar</button>
                    <button class="cx-btn cx-btn-sm cx-btn-primary" id="btn-abrir-whatsapp">Usar no CRM</button>
                    <button class="cx-btn cx-btn-sm cx-btn-secondary" id="btn-abrir-email">Abrir Email</button>
                    <button class="cx-btn cx-btn-sm cx-btn-ghost" id="btn-regenerar">Regenerar</button>
                </div>
            </div>
        </div>
        <!-- Tab: Editar -->
        <div class="p-4 hidden" id="tab-editar">
            <div class="space-y-3 mb-4">
                <div>
                    <label class="cx-label-row py-0"><span class="cx-label text-xs">Nome completo *</span></label>
                    <input type="text" id="ce-nome" class="cx-input cx-input-sm w-full" placeholder="Nome completo" />
                </div>
                <div>
                    <label class="cx-label-row py-0"><span class="cx-label text-xs">E-mail *</span></label>
                    <input type="email" id="ce-email" class="cx-input cx-input-sm w-full" placeholder="email@empresa.com" />
                </div>
                <div>
                    <label class="cx-label-row py-0"><span class="cx-label text-xs">Telefone</span></label>
                    <input type="text" id="ce-tel" class="cx-input cx-input-sm w-full" placeholder="(11) 99999-9999" />
                </div>
                <div>
                    <label class="cx-label-row py-0"><span class="cx-label text-xs">Segundo telefone</span></label>
                    <input type="text" id="ce-tel2" class="cx-input cx-input-sm w-full" placeholder="Opcional" />
                </div>
            </div>

            <button type="button" id="ce-btn-salvar" class="cx-btn cx-btn-sm cx-btn-primary w-full mb-4">
                Salvar alterações
            </button>

            <hr class="my-2 border-gray-200" />

            <div class="flex flex-col gap-1">
                <button type="button" id="ce-btn-deletar" class="cx-btn cx-btn-sm cx-btn-danger cx-btn-outline w-full">
                    Apagar contato
                </button>
                <p class="text-xs opacity-50 text-center">Só é possível apagar se o contato não tiver cotações, briefings ou PIs vinculados.</p>
            </div>
        </div>

    </div>
    <form method="dialog" class="cx-modal-dismiss"><button>close</button></form>
</dialog>
