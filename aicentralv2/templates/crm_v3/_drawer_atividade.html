{# Sidebar ampla de atividade — desktop em duas colunas, tablet/mobile empilhado.
   O roteiro permanece texto simples nesta fase, compatível com descricao. #}
<template id="cx-drawer-atividade-tpl">
  <form id="cx-drawer-atividade-form" data-drawer-form="atividade"
        class="cx-drawer-form cx-atividade-editor">
    <input type="hidden" name="id" data-field="id" />
    <input type="hidden" name="tipo" data-field="tipo" value="email" />
    <input type="hidden" name="status" data-field="status" value="pendente" />
    <input type="hidden" name="formato" data-field="formato" value="email" />
    <input type="hidden" name="foco" data-field="foco" value="" />
    <input type="hidden" name="tom" data-field="tom" value="consultivo" />
    <input type="hidden" name="canal_produto" data-field="canal_produto" value="" />

    <div class="cx-atividade-editor-grid">
      <main class="cx-atividade-editor-main">
        <section class="cx-atividade-relations-grid" aria-label="Cliente e contato">
          <div class="cx-drawer-field">
            <label for="cx-ativ-cliente">Cliente / empresa</label>
            <div class="cx-atividade-client-field" id="cx-ativ-cliente">
              <i class="fa-regular fa-building" aria-hidden="true"></i>
              <strong data-atividade-cliente>—</strong>
              <button type="button" data-atividade-cliente-clear aria-label="Limpar cliente">×</button>
            </div>
          </div>
          <div class="cx-drawer-field">
            <label for="cx-ativ-contato">Contato relacionado</label>
            <select id="cx-ativ-contato" name="contato_id" data-field="contato_id">
              <option value="">Nenhum contato selecionado</option>
            </select>
          </div>
        </section>

        <label class="cx-atividade-status-field" for="cx-ativ-status" data-status-field>
          <span class="sr-only">Status da atividade</span>
          <select id="cx-ativ-status" data-status-select>
            <option value="pendente">Pendente</option>
            <option value="em_andamento">Em andamento</option>
            <option value="concluida">Concluída</option>
          </select>
        </label>

        <section class="cx-atividade-side-card cx-atividade-details">
          <header class="cx-atividade-details-head">
            <div class="cx-atividade-side-title">
              <i class="fa-regular fa-clipboard" aria-hidden="true"></i>
              Detalhes da atividade
            </div>
          </header>

          <div class="cx-drawer-field cx-drawer-field-full">
            <label for="cx-ativ-titulo">Título da atividade <span class="cx-required">*</span></label>
            <input id="cx-ativ-titulo" type="text" name="titulo" data-field="titulo"
                   required placeholder="Ex.: Apresentar formatos interativos" />
          </div>

          <div class="cx-drawer-field cx-drawer-field-full">
            <label>Tipo de atividade <span class="cx-required">*</span></label>
            <div class="cx-drawer-chip-group cx-drawer-chip-group-compact"
                 data-chip-group="tipo" role="radiogroup" aria-label="Tipo de atividade">
              <button type="button" class="cx-drawer-chip" data-value="ligacao" role="radio" aria-checked="false" title="Ligação"><i class="fa-solid fa-phone"></i>Liga.</button>
              <button type="button" class="cx-drawer-chip" data-value="reuniao" role="radio" aria-checked="false" title="Reunião"><i class="fa-solid fa-users"></i>Reun.</button>
              <button type="button" class="cx-drawer-chip is-active" data-value="email" role="radio" aria-checked="true" title="E-mail"><i class="fa-regular fa-envelope"></i>Email</button>
              <button type="button" class="cx-drawer-chip" data-value="whatsapp" role="radio" aria-checked="false" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i>Zap</button>
              <button type="button" class="cx-drawer-chip" data-value="linkedin" role="radio" aria-checked="false" title="LinkedIn"><i class="fa-brands fa-linkedin"></i>In</button>
              <button type="button" class="cx-drawer-chip" data-value="doc" role="radio" aria-checked="false" title="Documento"><i class="fa-regular fa-file-lines"></i>Doc</button>
              <button type="button" class="cx-drawer-chip" data-value="planejamento" role="radio" aria-checked="false" title="Planejamento"><i class="fa-solid fa-diagram-project"></i>Plano</button>
            </div>
          </div>
        </section>

        <section class="cx-atividade-side-card cx-atividade-details">
          <header class="cx-atividade-side-title">
            <i class="fa-regular fa-calendar-check" aria-hidden="true"></i>
            Planejamento e prazo
          </header>
          <div class="cx-atividade-date-grid">
            <div class="cx-drawer-field">
              <label for="cx-ativ-prazo">Prazo</label>
              <input id="cx-ativ-prazo" type="date" name="data_prazo" data-field="data_prazo" />
            </div>
            <div class="cx-drawer-field">
              <label for="cx-ativ-data" data-activity-date-label>Data planejada <span class="cx-required">*</span></label>
              <input id="cx-ativ-data" type="date" name="data" data-field="data" required />
            </div>
            <div class="cx-drawer-field">
              <label for="cx-ativ-hora">Hora</label>
              <input id="cx-ativ-hora" type="time" name="hora" data-field="hora" />
            </div>
            <div class="cx-drawer-field">
              <label for="cx-ativ-responsavel">Responsável</label>
              <select id="cx-ativ-responsavel" name="executivo_id" data-field="executivo_id">
                <option value="">Selecionar</option>
              </select>
            </div>
          </div>
          <div class="cx-atividade-suggest-date" data-suggest-date hidden>
            <div>
              <strong>Sem prazo definido?</strong>
              <p>Sugere 2 dias úteis a partir de hoje.</p>
            </div>
            <button type="button" data-suggest-date-btn>Sugerir prazo</button>
          </div>
        </section>

        <section class="cx-atividade-side-card cx-meeting-panel" data-meeting-panel hidden>
          <header class="cx-atividade-side-title">
            <i class="fa-brands fa-google" aria-hidden="true"></i>
            Agenda da reunião
          </header>
          <p class="cx-meeting-intro">A data e a hora acima definem o início do convite.</p>
          <div class="cx-meeting-grid">
            <label class="cx-drawer-field">
              <span>Duração</span>
              <select data-meeting-field="duration_minutes">
                <option value="30">30 minutos</option>
                <option value="45">45 minutos</option>
                <option value="60">1 hora</option>
                <option value="90">1h30</option>
              </select>
            </label>
            <label class="cx-drawer-field">
              <span>Fuso horário</span>
              <select data-meeting-field="timezone">
                <option value="America/Sao_Paulo">Brasília</option>
                <option value="America/Manaus">Manaus</option>
                <option value="America/Rio_Branco">Rio Branco</option>
              </select>
            </label>
          </div>
          <div class="cx-drawer-field cx-drawer-field-full">
            <label for="cx-meeting-attendee">Convidados</label>
            <div class="cx-meeting-attendee-entry">
              <input id="cx-meeting-attendee" type="email" data-meeting-attendee-input
                     placeholder="nome@empresa.com" autocomplete="off" />
              <button type="button" data-meeting-attendee-add>Adicionar</button>
            </div>
            <div class="cx-meeting-attendees" data-meeting-attendees></div>
          </div>
          <label class="cx-meeting-create">
            <input type="checkbox" data-meeting-field="sync_google" />
            <span>
              <strong>Criar convite com Google Meet</strong>
              <small>Os convidados recebem o convite somente ao salvar a atividade.</small>
            </span>
          </label>
          <details class="cx-meeting-preview">
            <summary>Prévia do convite</summary>
            <div data-meeting-preview>
              <strong>Reunião</strong>
              <span>Preencha data, hora e convidados para revisar o convite.</span>
            </div>
          </details>
          <div class="cx-meeting-sync" data-meeting-sync
               data-google-connected="{{ 'true' if perfil_google and perfil_google.status == 'connected' else 'false' }}">
            {% if perfil_google and perfil_google.status == 'connected' %}
              <span><i class="fa-solid fa-circle-check"></i> Google conectado: {{ perfil_google.google_email }}</span>
            {% else %}
              <span><i class="fa-solid fa-circle-exclamation"></i> Conecte o Google no seu perfil antes de criar o Meet.</span>
              <a href="{{ url_for('perfil_google_conectar') }}">Conectar agora</a>
            {% endif %}
          </div>
          <div class="cx-meeting-event-status" data-meeting-event-status hidden></div>
        </section>

        <section class="cx-atividade-roteiro">
          <div class="cx-atividade-roteiro-head">
            <label for="cx-ativ-desc">Registro da atividade</label>
          </div>
          <textarea id="cx-ativ-desc" name="descricao" data-field="descricao" maxlength="50000"
                    placeholder="Registre objetivo, contexto e próximo passo. O roteiro sugerido fica separado até você aplicá-lo."></textarea>
          <div class="cx-atividade-roteiro-foot">
            <span class="cx-atividade-roteiro-hint">
              Este texto será salvo no histórico da atividade.
            </span>
            <span class="cx-atividade-roteiro-count" data-registro-count>0/50000</span>
          </div>
        </section>
      </main>

      <aside class="cx-atividade-editor-side">
        <section class="cx-drawer-ia-panel cx-atividade-ia" role="region"
                 aria-labelledby="cx-atividade-ia-title">
          <header class="cx-atividade-assist-head">
            <span class="cx-atividade-assist-icon"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i></span>
            <div>
              <h2 id="cx-atividade-ia-title">Assistente</h2>
              <p data-ia-channel-label>Use o contexto do CRM para gerar conteúdos, sugestões e próximos passos.</p>
            </div>
            <button type="button" class="cx-atividade-ia-generate" data-ia-action="gerar-roteiro">
              <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
              Gerar
            </button>
          </header>

          <div class="cx-atividade-ia-progress" data-ia-progress hidden>
            <p data-ia-progress-label>Lendo registro, cliente, contato, canal e histórico...</p>
            <div class="cx-atividade-ia-progress-track">
              <span data-ia-progress-bar></span>
            </div>
            <span data-ia-progress-pct>0%</span>
          </div>

          <details class="cx-atividade-ia-topics" data-ia-topics>
            <summary id="cx-atividade-ia-topics-title">
              Rumo da geração
              <em>opcional</em>
            </summary>
            <p class="cx-atividade-ia-topics-hint">Apresentar ou estudar só entra se você escolher. Sem seleção, o título e o registro bastam.</p>
            <div class="cx-atividade-ia-toolbar" role="group" aria-label="Rumo opcional da geração">
              <div class="cx-drawer-chip-group cx-drawer-chip-group-compact"
                   data-chip-group="foco" data-chip-optional role="radiogroup" aria-label="Objetivo da conversa">
                <button type="button" class="cx-drawer-chip" data-value="apresentar_solucao" role="radio" aria-checked="false">Apresentar</button>
                <button type="button" class="cx-drawer-chip" data-value="estudar" role="radio" aria-checked="false">Estudar</button>
                <button type="button" class="cx-drawer-chip" data-value="follow_up" role="radio" aria-checked="false">Follow-up</button>
                <button type="button" class="cx-drawer-chip" data-value="falar_sobre_canal" role="radio" aria-checked="false">Canal</button>
                <button type="button" class="cx-drawer-chip" data-value="apresentar_proposta" role="radio" aria-checked="false">Proposta</button>
                <button type="button" class="cx-drawer-chip" data-value="apresentar_empresa" role="radio" aria-checked="false">CentralComm</button>
                <button type="button" class="cx-drawer-chip" data-value="entender_necessidades" role="radio" aria-checked="false">Entender</button>
              </div>
              <div class="cx-drawer-chip-group cx-drawer-chip-group-compact"
                   data-chip-group="tom" role="radiogroup" aria-label="Tom da comunicação">
                <button type="button" class="cx-drawer-chip" data-value="institucional" role="radio" aria-checked="false">Institucional</button>
                <button type="button" class="cx-drawer-chip is-active" data-value="consultivo" role="radio" aria-checked="true">Consultivo</button>
                <button type="button" class="cx-drawer-chip" data-value="direto" role="radio" aria-checked="false">Direto</button>
                <button type="button" class="cx-drawer-chip" data-value="informal" role="radio" aria-checked="false">Informal</button>
              </div>
            </div>
          </details>

          <details class="cx-atividade-ia-products" data-canal-produtos aria-labelledby="cx-atividade-ia-canais-title">
            <summary id="cx-atividade-ia-canais-title">
              Canais de referência
              <em>para gerar o item</em>
            </summary>
            <p class="cx-atividade-ia-topics-hint">O canal só entra ao gerar, junto com o tipo (e-mail, zap, ligação…).</p>
            <div class="cx-drawer-chip-group cx-drawer-chip-group-compact"
                 data-chip-group="canal_produto" data-chip-optional role="radiogroup" aria-label="Canal ou produto">
              <button type="button" class="cx-drawer-chip" data-value="Netflix" role="radio" aria-checked="false"><span class="cx-atividade-brand" aria-hidden="true">N</span>Netflix</button>
              <button type="button" class="cx-drawer-chip" data-value="Spotify" role="radio" aria-checked="false"><span class="cx-atividade-brand" aria-hidden="true">S</span>Spotify</button>
              <button type="button" class="cx-drawer-chip" data-value="Serasa" role="radio" aria-checked="false"><span class="cx-atividade-brand" aria-hidden="true">S</span>Serasa</button>
              <button type="button" class="cx-drawer-chip" data-value="Disney" role="radio" aria-checked="false"><span class="cx-atividade-brand" aria-hidden="true">D</span>Disney</button>
              <button type="button" class="cx-drawer-chip" data-value="HBO" role="radio" aria-checked="false"><span class="cx-atividade-brand" aria-hidden="true">H</span>HBO</button>
              <button type="button" class="cx-drawer-chip" data-value="Amazon" role="radio" aria-checked="false"><span class="cx-atividade-brand" aria-hidden="true">A</span>Amazon</button>
              <button type="button" class="cx-drawer-chip" data-value="iFood" role="radio" aria-checked="false"><span class="cx-atividade-brand" aria-hidden="true">i</span>iFood</button>
              <button type="button" class="cx-drawer-chip" data-value="Uber" role="radio" aria-checked="false"><span class="cx-atividade-brand" aria-hidden="true">U</span>Uber</button>
              <button type="button" class="cx-drawer-chip" data-value="99" role="radio" aria-checked="false"><span class="cx-atividade-brand" aria-hidden="true">99</span>99</button>
              <button type="button" class="cx-drawer-chip" data-value="Logan" role="radio" aria-checked="false"><span class="cx-atividade-brand" aria-hidden="true">L</span>Logan</button>
            </div>
          </details>

          <div class="cx-atividade-ia-meta">
            <label class="cx-atividade-ia-note" for="cx-ativ-ia-instrucoes">
              <span class="sr-only">Orientação adicional</span>
              <input id="cx-ativ-ia-instrucoes" type="text" data-ia-field="instrucoes"
                     placeholder="Ajuste: objeção, caso ou prazo..." />
            </label>
            <p class="cx-atividade-ia-legend">
              <button type="button" data-ia-action="melhorar-texto">Revisar</button>
              = revisar contexto e dados
              ·
              <button type="button" data-ia-action="sugerir-atividade">Próxima</button>
              = gerar nova variação
              ·
              <button type="button" data-ia-action="touchpoints">Sequência</button>
              = próxima etapa do roteiro
            </p>
          </div>

          <div class="cx-drawer-ia-output" data-ia-output aria-live="polite">
            <p class="cx-atividade-ia-empty">A visualização fica aqui.</p>
          </div>
        </section>

        <section class="cx-atividade-ia-style" data-ia-style-section hidden>
          <div class="cx-atividade-ia-style-line">
            <strong>Modelo ativo</strong>
            <span data-ia-style-preview></span>
            <button type="button" data-ia-style-clear>Remover</button>
          </div>
        </section>

        <section class="cx-atividade-ia-history" data-ia-history-section hidden>
          <div class="cx-atividade-ia-history-title">
            <i class="fa-regular fa-clock" aria-hidden="true"></i>
            Histórico
          </div>
          <div data-ia-history></div>
        </section>
      </aside>
    </div>
  </form>
</template>
