{# Editor amplo de atividade — desktop em duas colunas, mobile empilhado.
   O roteiro permanece texto simples nesta fase, compatível com descricao. #}
<template id="cx-drawer-atividade-tpl">
  <form id="cx-drawer-atividade-form" data-drawer-form="atividade"
        class="cx-drawer-form cx-atividade-editor">
    <input type="hidden" name="id" data-field="id" />
    <input type="hidden" name="tipo" data-field="tipo" value="atividade" />
    <input type="hidden" name="status" data-field="status" value="pendente" />
    <input type="hidden" name="formato" data-field="formato" value="roteiro" />
    <input type="hidden" name="foco" data-field="foco" value="apresentar_empresa" />
    <input type="hidden" name="tom" data-field="tom" value="institucional" />

    <div class="cx-atividade-editor-grid">
      <main class="cx-atividade-editor-main">
        <div class="cx-drawer-field cx-drawer-field-full">
          <label for="cx-ativ-titulo">Título da atividade <span class="cx-required">*</span></label>
          <div class="cx-drawer-input-wrap">
            <i class="fa-regular fa-circle-check cx-drawer-input-icon" aria-hidden="true"></i>
            <input id="cx-ativ-titulo" type="text" name="titulo" data-field="titulo"
                   required placeholder="Ex.: Apresentar plano de mídia para o cliente" />
          </div>
        </div>

        <section class="cx-atividade-side-card cx-atividade-details">
          <header class="cx-atividade-side-title">
            <i class="fa-regular fa-calendar-check" aria-hidden="true"></i>
            Planejamento
          </header>

          <div class="cx-drawer-field cx-drawer-field-full">
            <label>Tipo <span class="cx-required">*</span></label>
            <div class="cx-drawer-chip-group cx-drawer-chip-group-compact"
                 data-chip-group="tipo" role="radiogroup" aria-label="Tipo de atividade">
              <button type="button" class="cx-drawer-chip is-active" data-value="atividade" role="radio" aria-checked="true"><i class="fa-regular fa-circle-check"></i>Atividade</button>
              <button type="button" class="cx-drawer-chip" data-value="ligacao" role="radio" aria-checked="false"><i class="fa-solid fa-phone"></i>Ligação</button>
              <button type="button" class="cx-drawer-chip" data-value="reuniao" role="radio" aria-checked="false"><i class="fa-solid fa-users"></i>Reunião</button>
              <button type="button" class="cx-drawer-chip" data-value="email" role="radio" aria-checked="false"><i class="fa-regular fa-envelope"></i>E-mail</button>
              <button type="button" class="cx-drawer-chip" data-value="whatsapp" role="radio" aria-checked="false"><i class="fa-brands fa-whatsapp"></i>WhatsApp</button>
              <button type="button" class="cx-drawer-chip" data-value="doc" role="radio" aria-checked="false"><i class="fa-regular fa-file-lines"></i>Documento</button>
              <button type="button" class="cx-drawer-chip" data-value="planejamento" role="radio" aria-checked="false"><i class="fa-solid fa-diagram-project"></i>Planejamento</button>
            </div>
          </div>

          <div class="cx-atividade-date-grid">
            <div class="cx-drawer-field">
              <label for="cx-ativ-data">Data <span class="cx-required">*</span></label>
              <input id="cx-ativ-data" type="date" name="data" data-field="data" required />
            </div>
            <div class="cx-drawer-field">
              <label for="cx-ativ-hora">Hora</label>
              <input id="cx-ativ-hora" type="time" name="hora" data-field="hora" />
            </div>
            <div class="cx-drawer-field">
              <label for="cx-ativ-prazo">Prazo</label>
              <input id="cx-ativ-prazo" type="date" name="data_prazo" data-field="data_prazo" />
            </div>
          </div>

          <div class="cx-atividade-owner-status">
            <div class="cx-drawer-field">
              <label for="cx-ativ-responsavel">Responsável</label>
              <select id="cx-ativ-responsavel" name="executivo_id" data-field="executivo_id">
                <option value="">Selecionar</option>
              </select>
            </div>
            <div class="cx-drawer-field">
              <label>Status</label>
              <div class="cx-drawer-chip-group cx-drawer-chip-group-compact"
                   data-chip-group="status" role="radiogroup" aria-label="Status">
                <button type="button" class="cx-drawer-chip is-active" data-value="pendente" role="radio" aria-checked="true"><i class="fa-regular fa-circle"></i>Pendente</button>
                <button type="button" class="cx-drawer-chip" data-value="em_andamento" role="radio" aria-checked="false"><i class="fa-solid fa-hourglass-half"></i>Em andamento</button>
                <button type="button" class="cx-drawer-chip" data-value="concluida" role="radio" aria-checked="false"><i class="fa-solid fa-circle-check"></i>Concluída</button>
              </div>
            </div>
          </div>
        </section>

        <section class="cx-atividade-side-card cx-atividade-relations">
          <header class="cx-atividade-side-title">
            <i class="fa-regular fa-user" aria-hidden="true"></i>
            Relacionamento
          </header>
          <div class="cx-atividade-client-context">
            <span>Cliente / empresa</span>
            <strong data-atividade-cliente>—</strong>
          </div>
          <div class="cx-drawer-field cx-drawer-field-full">
            <label for="cx-ativ-contato">Contato relacionado</label>
            <select id="cx-ativ-contato" name="contato_id" data-field="contato_id">
              <option value="">Nenhum contato</option>
            </select>
          </div>
        </section>

        <section class="cx-atividade-roteiro">
          <div class="cx-atividade-roteiro-head">
            <label for="cx-ativ-desc">Registro da atividade</label>
            <button type="button" class="cx-atividade-modelo-btn" data-atividade-modelo>
              <i class="fa-regular fa-rectangle-list" aria-hidden="true"></i>
              Usar modelo
            </button>
          </div>
          <textarea id="cx-ativ-desc" name="descricao" data-field="descricao"
                    placeholder="Registre objetivo, contexto e próximo passo. O roteiro sugerido fica separado até você aplicá-lo."></textarea>
          <span class="cx-atividade-roteiro-hint">
            Este texto será salvo no histórico da atividade.
          </span>
        </section>
      </main>

      <aside class="cx-atividade-editor-side">
        <section class="cx-drawer-ia-panel cx-atividade-ia" role="region"
                 aria-labelledby="cx-atividade-ia-title">
          <header class="cx-atividade-assist-head">
            <span class="cx-atividade-assist-icon"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i></span>
            <div>
              <h2 id="cx-atividade-ia-title">Preparar roteiro</h2>
              <p>Use o contexto do CRM sem alterar o registro da atividade.</p>
            </div>
          </header>

          <div class="cx-atividade-ia-options">
            <div class="cx-drawer-field cx-drawer-field-full">
              <label>Objetivo da conversa</label>
              <div class="cx-drawer-chip-group cx-drawer-chip-group-compact"
                   data-chip-group="foco" role="radiogroup" aria-label="Objetivo da conversa">
                <button type="button" class="cx-drawer-chip is-active" data-value="apresentar_empresa" role="radio" aria-checked="true">Apresentar empresa</button>
                <button type="button" class="cx-drawer-chip" data-value="entender_necessidades" role="radio" aria-checked="false">Entender necessidades</button>
                <button type="button" class="cx-drawer-chip" data-value="apresentar_proposta" role="radio" aria-checked="false">Apresentar proposta</button>
                <button type="button" class="cx-drawer-chip" data-value="follow_up" role="radio" aria-checked="false">Follow-up</button>
                <button type="button" class="cx-drawer-chip" data-value="outro" role="radio" aria-checked="false">Outro</button>
              </div>
            </div>

            <div class="cx-drawer-field cx-drawer-field-full">
              <label>Tom</label>
              <div class="cx-drawer-chip-group cx-drawer-chip-group-compact"
                   data-chip-group="tom" role="radiogroup" aria-label="Tom da comunicação">
                <button type="button" class="cx-drawer-chip is-active" data-value="institucional" role="radio" aria-checked="true">Institucional</button>
                <button type="button" class="cx-drawer-chip" data-value="consultivo" role="radio" aria-checked="false">Consultivo</button>
                <button type="button" class="cx-drawer-chip" data-value="direto" role="radio" aria-checked="false">Direto</button>
                <button type="button" class="cx-drawer-chip" data-value="informal" role="radio" aria-checked="false">Informal</button>
              </div>
            </div>

            <div class="cx-drawer-field cx-drawer-field-full">
              <label for="cx-ativ-ia-instrucoes">Orientação adicional</label>
              <textarea id="cx-ativ-ia-instrucoes" rows="3" data-ia-field="instrucoes"
                        placeholder="Ex.: destacar um case, antecipar uma objeção ou combinar prazo."></textarea>
            </div>
          </div>

          <div class="cx-atividade-ia-toolbar">
            <div class="cx-drawer-chip-group cx-drawer-chip-group-compact"
                 data-chip-group="formato" role="radiogroup" aria-label="Formato da sugestão">
              <button type="button" class="cx-drawer-chip is-active" data-value="roteiro" role="radio" aria-checked="true">
                <i class="fa-solid fa-list-check" aria-hidden="true"></i>Roteiro
              </button>
              <button type="button" class="cx-drawer-chip" data-value="whatsapp" role="radio" aria-checked="false">
                <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>WhatsApp
              </button>
              <button type="button" class="cx-drawer-chip" data-value="email" role="radio" aria-checked="false">
                <i class="fa-regular fa-envelope" aria-hidden="true"></i>E-mail
              </button>
            </div>
            <button type="button" class="cx-atividade-ia-generate" data-ia-action="gerar-roteiro">
              <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
              Sugerir roteiro
            </button>
          </div>

          <div class="cx-drawer-ia-output" data-ia-output aria-live="polite"></div>
        </section>

        <section class="cx-atividade-ia-history" data-ia-history-section hidden>
          <div class="cx-atividade-ia-history-title">
            <i class="fa-regular fa-lightbulb" aria-hidden="true"></i>
            Roteiros disponíveis
          </div>
          <div data-ia-history></div>
        </section>

        <details class="cx-atividade-side-tools">
          <summary>
            <span><i class="fa-solid fa-sparkles" aria-hidden="true"></i>Outras ações assistidas</span>
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
          </summary>
          <div class="cx-atividade-side-tools-list">
            <button type="button" data-ia-action="melhorar-texto">
              <i class="fa-solid fa-spell-check"></i> Revisar registro atual
            </button>
            <button type="button" data-ia-action="sugerir-atividade">
              <i class="fa-regular fa-lightbulb"></i> Sugerir próxima atividade
            </button>
            <button type="button" data-ia-action="gerar-comunicacao">
              <i class="fa-regular fa-envelope"></i> Rascunhar comunicação
            </button>
            <button type="button" data-ia-action="touchpoints">
              <i class="fa-solid fa-diagram-project"></i> Criar sequência de follow-up
            </button>
          </div>
        </details>
      </aside>
    </div>
  </form>
</template>
