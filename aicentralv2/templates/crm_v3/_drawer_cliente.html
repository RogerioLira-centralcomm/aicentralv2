{# Cadastro unificado: dados no corpo e relacionamentos na coluna lateral. #}
<template id="cx-drawer-cliente-tpl">
  <form id="cx-drawer-cliente-form" class="crm-v3-cliente-editor" data-drawer-form="cliente">
    <input type="hidden" name="id" data-field="id" />

    <div class="crm-v3-cliente-editor-grid">
      <main class="crm-v3-cliente-editor-main">
        <section class="cx-drawer-section">
          <div class="cx-drawer-section-title">Identificação</div>
          <div class="cx-drawer-section-subtitle">Dados fiscais e nome usado no dia a dia.</div>
          <div class="crm-v3-cliente-form-grid">
            <div class="cx-drawer-field">
              <label for="cx-cliente-pessoa">Pessoa</label>
              <select id="cx-cliente-pessoa" name="pessoa" data-field="pessoa">
                <option value="J">Pessoa jurídica</option>
                <option value="F">Pessoa física</option>
              </select>
            </div>
            <div class="cx-drawer-field">
              <label for="cx-cliente-documento">CNPJ / CPF</label>
              <input id="cx-cliente-documento" type="text" name="cnpj" data-field="cnpj"
                     placeholder="00.000.000/0000-00" autocomplete="off" />
            </div>
            <div class="cx-drawer-field crm-v3-cliente-field-span-2">
              <label for="cx-cliente-nome">Nome fantasia *</label>
              <input id="cx-cliente-nome" type="text" name="nome" data-field="nome"
                     placeholder="Nome usado no CRM" required />
            </div>
            <div class="cx-drawer-field crm-v3-cliente-field-span-2">
              <label for="cx-cliente-razao">Razão social</label>
              <input id="cx-cliente-razao" type="text" name="razao_social" data-field="razao_social"
                     placeholder="Nome empresarial completo" />
            </div>
            <div class="cx-drawer-field">
              <label for="cx-cliente-ie">Inscrição estadual</label>
              <input id="cx-cliente-ie" type="text" name="inscricao_estadual"
                     data-field="inscricao_estadual" placeholder="Não informada" />
            </div>
            <div class="cx-drawer-field">
              <label for="cx-cliente-im">Inscrição municipal</label>
              <input id="cx-cliente-im" type="text" name="inscricao_municipal"
                     data-field="inscricao_municipal" placeholder="Não informada" />
            </div>
            <div class="cx-drawer-field">
              <label for="cx-cliente-tipo">Tipo de cliente</label>
              <select id="cx-cliente-tipo" name="id_tipo_cliente" data-field="id_tipo_cliente"
                      data-lookup="tipos_cliente" data-lookup-label="label">
                <option value="">— Carregando tipos… —</option>
              </select>
            </div>
            <div class="cx-drawer-field">
              <label for="cx-cliente-perfil">Perfil</label>
              <select id="cx-cliente-perfil" name="perfil" data-field="perfil">
                <option value="direto">Cliente final</option>
                <option value="agencia">Agência</option>
              </select>
            </div>
          </div>
        </section>

        <section class="cx-drawer-section">
          <div class="cx-drawer-section-title">Comercial</div>
          <div class="cx-drawer-section-subtitle">Responsabilidade, condições e capacidades atendidas.</div>
          <div class="crm-v3-cliente-form-grid">
            <div class="cx-drawer-field">
              <label for="cx-cliente-classificacao">Classificação</label>
              <select id="cx-cliente-classificacao" name="classificacao_cliente" data-field="classificacao_cliente">
                <option value="Prospecção">Prospecção</option>
                <option value="Ativo">Ativo</option>
                <option value="Geladeira">Geladeira</option>
              </select>
            </div>
            <div class="cx-drawer-field">
              <label for="cx-cliente-executivo">Executivo</label>
              <select id="cx-cliente-executivo" name="executivo_id" data-field="executivo_id"
                      data-lookup="executivos" data-lookup-value="id" data-lookup-label="nome">
                <option value="">— Carregando… —</option>
              </select>
            </div>
            <div class="cx-drawer-field">
              <label for="cx-cliente-bv">BV %</label>
              <input id="cx-cliente-bv" type="number" name="bv_percentual" data-field="bv_percentual"
                     step="0.01" min="0" max="100" placeholder="0" />
            </div>
            <div class="cx-drawer-field">
              <label for="cx-cliente-margem">Margem CC %</label>
              <input id="cx-cliente-margem" type="number" name="margem_cc" data-field="margem_cc"
                     step="0.01" min="0" max="100" placeholder="0" />
            </div>
            <div class="cx-drawer-field crm-v3-cliente-field-span-2">
              <span class="crm-v3-cliente-field-label">Habilidades comerciais</span>
              <div class="crm-v3-checkbox-row">
                <label class="crm-v3-checkbox-inline"><input type="checkbox" name="opera_midia" data-field="opera_midia" class="cx-checkbox cx-checkbox-sm" /> <span>Opera mídia</span></label>
                <label class="crm-v3-checkbox-inline"><input type="checkbox" name="demanda_dados" data-field="demanda_dados" class="cx-checkbox cx-checkbox-sm" /> <span>Demanda dados</span></label>
                <label class="crm-v3-checkbox-inline"><input type="checkbox" name="demanda_programatica_canais" data-field="demanda_programatica_canais" class="cx-checkbox cx-checkbox-sm" /> <span>Programática</span></label>
              </div>
            </div>
            <div class="cx-drawer-field crm-v3-cliente-field-span-2">
              <label for="cx-cliente-observacoes">Observações comerciais</label>
              <textarea id="cx-cliente-observacoes" rows="3" name="observacoes_comerciais_adicionais"
                        data-field="observacoes_comerciais_adicionais"
                        placeholder="Contexto relevante para o atendimento"></textarea>
            </div>
          </div>
        </section>

        <details class="crm-v3-cliente-address cx-drawer-section">
          <summary>
            <span>
              <strong>Endereço</strong>
              <small id="cx-cliente-endereco-resumo">Não informado</small>
            </span>
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
          </summary>
          <div class="crm-v3-cliente-form-grid crm-v3-cliente-address-grid">
            <div class="cx-drawer-field">
              <label for="cx-cliente-cep">CEP</label>
              <input id="cx-cliente-cep" type="text" name="cep" data-field="endereco.cep"
                     placeholder="00000-000" inputmode="numeric" autocomplete="postal-code" />
            </div>
            <div class="cx-drawer-field">
              <label for="cx-cliente-uf">UF</label>
              <select id="cx-cliente-uf" name="uf" data-field="endereco.uf"
                      data-lookup="estados" data-lookup-value="sigla" data-lookup-label="sigla">
                <option value="">— Selecionar —</option>
              </select>
            </div>
            <div class="cx-drawer-field">
              <label for="cx-cliente-cidade">Cidade</label>
              <input id="cx-cliente-cidade" type="text" name="cidade" data-field="endereco.cidade"
                     placeholder="Não informada" autocomplete="address-level2" />
            </div>
            <div class="cx-drawer-field">
              <label for="cx-cliente-bairro">Bairro</label>
              <input id="cx-cliente-bairro" type="text" name="bairro" data-field="endereco.bairro"
                     placeholder="Não informado" />
            </div>
            <div class="cx-drawer-field crm-v3-cliente-field-span-2">
              <label for="cx-cliente-logradouro">Logradouro</label>
              <input id="cx-cliente-logradouro" type="text" name="logradouro" data-field="endereco.logradouro"
                     placeholder="Rua, avenida ou rodovia" autocomplete="street-address" />
            </div>
            <div class="cx-drawer-field">
              <label for="cx-cliente-numero">Número</label>
              <input id="cx-cliente-numero" type="text" name="numero" data-field="endereco.numero"
                     placeholder="Sem número" />
            </div>
            <div class="cx-drawer-field">
              <label for="cx-cliente-complemento">Complemento</label>
              <input id="cx-cliente-complemento" type="text" name="complemento"
                     data-field="endereco.complemento" placeholder="Sala, andar ou bloco" />
            </div>
          </div>
        </details>
      </main>

      <aside class="crm-v3-cliente-editor-side" aria-labelledby="cx-cliente-agencias-title">
        <section class="crm-v3-cliente-agencias">
          <div class="crm-v3-cliente-agencias-head">
            <div>
              <h3 id="cx-cliente-agencias-title">Vínculos com agência</h3>
              <p>Agências que atendem este cliente.</p>
            </div>
            <span id="cx-drawer-cliente-agencias-count" aria-live="polite">0</span>
          </div>

          <label class="crm-v3-cliente-agencia-search" for="cx-drawer-cliente-agencia-search">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <input type="search" id="cx-drawer-cliente-agencia-search"
                   placeholder="Buscar agência para vincular" autocomplete="off"
                   role="combobox" aria-autocomplete="list"
                   aria-controls="cx-drawer-cliente-agencia-results" aria-expanded="false" />
          </label>
          <div id="cx-drawer-cliente-agencia-results"
               class="crm-v3-cliente-agencia-results"
               role="listbox" aria-label="Agências encontradas" hidden></div>

          <div id="cx-drawer-cliente-agencias" class="crm-v3-agencias-list" aria-live="polite"></div>
        </section>
      </aside>
    </div>
  </form>
</template>
