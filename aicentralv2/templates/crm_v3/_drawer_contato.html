{# Drawer MD — Contato completo (design system vanilla cx-*). #}
<template id="cx-drawer-contato-tpl">
  <form id="cx-drawer-contato-form" data-drawer-form="contato" class="cx-drawer-form">
    <input type="hidden" name="id" data-field="id" />

    <section class="cx-drawer-section">
      <header class="cx-drawer-section-head">
        <span class="cx-drawer-section-title">Identificação</span>
        <span class="cx-drawer-section-hint">Quem é essa pessoa</span>
      </header>
      <div class="cx-drawer-grid">
        <div class="cx-drawer-field cx-drawer-field-full">
          <label for="cx-contato-nome">Nome <span class="cx-required">*</span></label>
          <input id="cx-contato-nome" type="text" name="nome" data-field="nome" required placeholder="Nome completo" />
        </div>
        <div class="cx-drawer-field">
          <label for="cx-contato-cargo">Cargo</label>
          <input id="cx-contato-cargo" type="text" name="cargo" data-field="cargo" placeholder="Ex.: Gerente de mídia" />
        </div>
        <div class="cx-drawer-field">
          <label for="cx-contato-setor">Setor</label>
          <input id="cx-contato-setor" type="text" name="setor" data-field="setor" placeholder="Ex.: Marketing" />
        </div>
        <div class="cx-drawer-field">
          <label for="cx-contato-status">Status</label>
          <select id="cx-contato-status" name="status" data-field="status">
            <option value="Ativo">Ativo</option>
            <option value="Inativo">Inativo</option>
          </select>
        </div>
        <div class="cx-drawer-field cx-drawer-field-toggle">
          <label class="cx-drawer-toggle">
            <input type="checkbox" name="principal" data-field="principal" />
            <span class="cx-drawer-toggle-switch" aria-hidden="true"></span>
            <span class="cx-drawer-toggle-label">
              <strong>Contato principal</strong>
              <em>Aparece como referência do cliente</em>
            </span>
          </label>
        </div>
      </div>
    </section>

    <section class="cx-drawer-section">
      <header class="cx-drawer-section-head">
        <span class="cx-drawer-section-title">Canais de contato</span>
        <span class="cx-drawer-section-hint">Como falar com essa pessoa</span>
      </header>
      <div class="cx-drawer-grid">
        <div class="cx-drawer-field cx-drawer-field-full">
          <label for="cx-contato-email">E-mail <span class="cx-required">*</span></label>
          <div class="cx-drawer-input-wrap">
            <i class="fa-regular fa-envelope cx-drawer-input-icon" aria-hidden="true"></i>
            <input id="cx-contato-email" type="email" name="email" data-field="email" required placeholder="nome@empresa.com" />
          </div>
        </div>
        <div class="cx-drawer-field">
          <label for="cx-contato-tel">Telefone principal</label>
          <div class="cx-drawer-input-wrap">
            <i class="fa-solid fa-phone cx-drawer-input-icon" aria-hidden="true"></i>
            <input id="cx-contato-tel" type="text" name="telefone" data-field="telefone" placeholder="(31) 99999-9999" />
          </div>
        </div>
        <div class="cx-drawer-field">
          <label for="cx-contato-tel2">Telefone secundário</label>
          <div class="cx-drawer-input-wrap">
            <i class="fa-solid fa-phone cx-drawer-input-icon" aria-hidden="true"></i>
            <input id="cx-contato-tel2" type="text" name="telefone_secundario" data-field="telefone_secundario" placeholder="Opcional" />
          </div>
        </div>
      </div>
    </section>
  </form>
</template>
