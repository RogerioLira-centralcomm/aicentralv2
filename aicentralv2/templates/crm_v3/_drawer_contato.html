{# Drawer MD — Contato completo (Fase 2). #}
<template id="cx-drawer-contato-tpl">
  <form id="cx-drawer-contato-form" data-drawer-form="contato">
    <input type="hidden" name="id" data-field="id" />

    <div class="cx-drawer-section">
      <div class="cx-drawer-section-title">Identificação</div>
      <div class="cx-drawer-grid">
        <div class="cx-drawer-field" style="grid-column: span 2;">
          <label>Nome *</label>
          <input type="text" name="nome" data-field="nome" required />
        </div>
        <div class="cx-drawer-field">
          <label>Cargo</label>
          <input type="text" name="cargo" data-field="cargo" />
        </div>
        <div class="cx-drawer-field">
          <label>Setor</label>
          <input type="text" name="setor" data-field="setor" />
        </div>
        <div class="cx-drawer-field">
          <label>Status</label>
          <select name="status" data-field="status">
            <option value="Ativo">Ativo</option>
            <option value="Inativo">Inativo</option>
          </select>
        </div>
        <div class="cx-drawer-field">
          <label>Contato principal</label>
          <label class="crm-v3-checkbox-inline">
            <input type="checkbox" name="principal" data-field="principal" class="checkbox checkbox-xs" />
            <span>Sim, marcar como principal</span>
          </label>
        </div>
      </div>
    </div>

    <div class="cx-drawer-section">
      <div class="cx-drawer-section-title">Contatos</div>
      <div class="cx-drawer-grid">
        <div class="cx-drawer-field" style="grid-column: span 2;">
          <label>E-mail *</label>
          <input type="email" name="email" data-field="email" required />
        </div>
        <div class="cx-drawer-field">
          <label>Telefone principal</label>
          <input type="text" name="telefone" data-field="telefone" placeholder="(31) 99999-9999" />
        </div>
        <div class="cx-drawer-field">
          <label>Telefone secundário</label>
          <input type="text" name="telefone_secundario" data-field="telefone_secundario" />
        </div>
      </div>
    </div>
  </form>
</template>
