{# Drawer compacto — edição do contato a partir do nome na lista. #}
<template id="cx-drawer-contato-tpl">
  <form id="cx-drawer-contato-form" data-drawer-form="contato" class="cx-drawer-form">
    <input type="hidden" name="id" data-field="id" />
    <input type="hidden" name="status" data-field="status" />
    <input type="hidden" name="telefone_secundario" data-field="telefone_secundario" />

    <section class="cx-drawer-section">
      <div class="cx-drawer-grid">
        <div class="cx-drawer-field cx-drawer-field-full">
          <label for="cx-contato-nome">Nome <span class="cx-required">*</span></label>
          <input id="cx-contato-nome" type="text" name="nome" data-field="nome" required placeholder="Nome completo" />
        </div>
        <div class="cx-drawer-field">
          <label for="cx-contato-cargo">Cargo</label>
          <input id="cx-contato-cargo" type="text" name="cargo" data-field="cargo"
                 list="cx-contato-cargos-datalist" placeholder="Ex.: Gerente de mídia" />
          <datalist id="cx-contato-cargos-datalist" data-lookup-datalist="cargos" data-lookup-value="nome"></datalist>
        </div>
        <div class="cx-drawer-field">
          <label for="cx-contato-setor">Setor</label>
          <input id="cx-contato-setor" type="text" name="setor" data-field="setor"
                 list="cx-contato-setores-datalist" placeholder="Ex.: Marketing" />
          <datalist id="cx-contato-setores-datalist" data-lookup-datalist="setores" data-lookup-value="nome"></datalist>
        </div>
        <div class="cx-drawer-field cx-drawer-field-full">
          <label for="cx-contato-email">E-mail</label>
          <div class="cx-drawer-input-wrap">
            <i class="fa-regular fa-envelope cx-drawer-input-icon" aria-hidden="true"></i>
            <input id="cx-contato-email" type="email" name="email" data-field="email" placeholder="nome@empresa.com" />
          </div>
        </div>
        <div class="cx-drawer-field cx-drawer-field-full">
          <label for="cx-contato-tel">Telefone</label>
          <div class="cx-drawer-input-wrap">
            <i class="fa-solid fa-phone cx-drawer-input-icon" aria-hidden="true"></i>
            <input id="cx-contato-tel" type="text" name="telefone" data-field="telefone" placeholder="(31) 99999-9999" />
          </div>
        </div>
        <div class="cx-drawer-field cx-drawer-field-full cx-drawer-field-toggle">
          <label class="cx-drawer-toggle">
            <input type="checkbox" name="principal" data-field="principal" />
            <span class="cx-drawer-toggle-switch" aria-hidden="true"></span>
            <span class="cx-drawer-toggle-label">
              <strong>Contato principal</strong>
            </span>
          </label>
        </div>
      </div>
    </section>
  </form>
</template>
