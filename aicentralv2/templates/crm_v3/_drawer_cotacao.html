{# Drawer unificado de cotação: criação, consulta e edição do cabeçalho. #}
<template id="cx-drawer-cotacao-tpl">
  <form id="cx-drawer-cotacao-form" class="cx-cotacao-editor" data-drawer-form="cotacao">
    <input type="hidden" name="id" data-field="id">
    <input type="hidden" name="agencia_id" data-field="agencia_id" id="cx-cot-agencia-id">
    <input type="hidden" name="client_id" data-field="client_id" id="cx-cot-client-id">

    <div class="cx-drawer-context" id="cx-cot-contexto" hidden>
      <div class="cx-drawer-context-row" id="cx-cot-ctx-cliente-row" hidden>
        <span class="cx-drawer-context-icon" aria-hidden="true"><i class="fa-solid fa-user-tie"></i></span>
        <span class="cx-drawer-context-label">Cliente da cotação</span>
        <button type="button" class="cx-name-picker" id="cx-cot-client-picker" hidden>
          <span id="cx-cot-client-picker-label">Selecionar cliente</span>
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        </button>
        <span class="cx-drawer-context-value" id="cx-cot-ctx-cliente-nome" hidden>—</span>
      </div>
      <div class="cx-drawer-context-row" id="cx-cot-ctx-agencia-row" hidden>
        <span class="cx-drawer-context-icon" aria-hidden="true"><i class="fa-solid fa-building"></i></span>
        <span class="cx-drawer-context-label">Agência</span>
        <button type="button" class="cx-name-picker" id="cx-cot-agencia-picker" hidden>
          <span id="cx-cot-agencia-picker-label">Selecionar agência</span>
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        </button>
        <span class="cx-drawer-context-value" id="cx-cot-ctx-agencia-nome">—</span>
      </div>
    </div>

    <dialog id="cx-cot-pick-modal" class="cx-name-pick-dialog">
      <div class="cx-name-pick-box">
        <h3 id="cx-cot-pick-title">Escolher</h3>
        <input type="search" id="cx-cot-pick-q" placeholder="Filtrar pelo nome" autocomplete="off">
        <div id="cx-cot-pick-list" class="cx-name-pick-list"></div>
        <div class="cx-name-pick-actions">
          <button type="button" class="cx-btn cx-btn-secondary" id="cx-cot-pick-clear" hidden>Sem cliente</button>
          <button type="button" class="cx-btn cx-btn-secondary" id="cx-cot-pick-cancel">Cancelar</button>
        </div>
      </div>
    </dialog>

    <div class="cx-cotacao-editor-grid">
      <main class="cx-cotacao-editor-main">
        <section class="cx-drawer-section cx-cot-start" id="cx-cot-type-choice">
          <div class="cx-drawer-section-title">Como esta proposta será montada?</div>
          <div class="cx-drawer-section-subtitle">O tipo define a próxima tela. Você pode revisar antes de criar o rascunho.</div>
          <input id="cx-cot-tipo" type="hidden" name="tipo_comercial"
                 data-field="tipo_comercial" value="midia">
          <div class="cx-cot-type-track" role="radiogroup" aria-label="Tipo de cotação">
            <button type="button" class="cx-cot-type-option is-active" data-cot-type="midia"
                    role="radio" aria-checked="true" value="midia">
              <i class="fa-solid fa-chart-simple" aria-hidden="true"></i>
              <span><strong>Mídia</strong><small>Itens, audiência e calculadora</small></span>
            </button>
            <button type="button" class="cx-cot-type-option" data-cot-type="parceiros"
                    role="radio" aria-checked="false" value="parceiros">
              <i class="fa-solid fa-handshake" aria-hidden="true"></i>
              <span><strong>Parceiros</strong><small>Escopo e condição comercial</small></span>
            </button>
            <button type="button" class="cx-cot-type-option" data-cot-type="formatos_interativos"
                    role="radio" aria-checked="false" value="formatos_interativos">
              <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
              <span><strong>Formatos interativos</strong><small>Experiência e produção</small></span>
            </button>
            <button type="button" class="cx-cot-type-option" data-cot-type="dados"
                    role="radio" aria-checked="false" value="dados">
              <i class="fa-solid fa-database" aria-hidden="true"></i>
              <span><strong>Dados</strong><small>Base, recorte e entrega</small></span>
            </button>
          </div>
          <p class="cx-drawer-field-hint cx-cot-type-hint" id="cx-cot-tipo-hint" role="status" aria-live="polite">
            Mídia usa a montagem e a calculadora atuais.
          </p>
        </section>
        <section class="cx-cot-type-locked" id="cx-cot-type-locked" hidden>
          <span class="cx-cot-type-locked-icon" aria-hidden="true"><i class="fa-solid fa-lock"></i></span>
          <span>
            <small>Tipo de cotação</small>
            <strong id="cx-cot-type-locked-label">Mídia</strong>
          </span>
          <em>Definido na criação</em>
        </section>

        <section class="cx-drawer-section">
          <div class="cx-drawer-section-title">Ponto de partida</div>
          <div class="cx-drawer-section-subtitle">O suficiente para abrir um rascunho identificável e continuar sem retrabalho.</div>
          <div class="cx-drawer-grid">
            <div class="cx-drawer-field cx-drawer-field-span-2">
              <label for="cx-cot-nome">Nome da campanha *</label>
              <input id="cx-cot-nome" type="text" name="nome_campanha"
                     data-field="nome_campanha" placeholder="Ex.: Campanha Black Friday 2026"
                     required autocomplete="off">
            </div>
            <div class="cx-drawer-field cx-drawer-field-span-2">
              <label for="cx-cot-objetivo">Objetivo da campanha</label>
              <textarea id="cx-cot-objetivo" name="objetivo" data-field="objetivo"
                        rows="4" placeholder="Descreva o resultado esperado e o contexto da proposta."></textarea>
            </div>
            <div class="cx-drawer-field cx-drawer-field-span-2" data-cot-media-only>
              <label for="cx-cot-plataformas">Plataformas</label>
              <input id="cx-cot-plataformas" type="text" name="plataformas"
                     data-field="plataformas" placeholder="TV, OOH, Meta Ads">
              <span class="cx-drawer-field-hint">Separe os canais por vírgula.</span>
            </div>
          </div>
        </section>

        <details class="cx-cot-refine" id="cx-cot-refine">
          <summary>
            <span>
              <strong>Refinar rascunho</strong>
              <small>Participantes, briefing e premissas</small>
            </span>
            <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
          </summary>
          <div class="cx-cot-refine-body">
            <section class="cx-drawer-section">
              <div class="cx-drawer-section-title">Participantes</div>
              <div class="cx-drawer-grid">
                <div class="cx-drawer-field">
                  <label for="cx-cot-client-user">Contato do cliente</label>
                  <select id="cx-cot-client-user" name="client_user_id" data-field="client_user_id">
                    <option value="">Selecione depois</option>
                  </select>
                </div>
                <div class="cx-drawer-field">
                  <label for="cx-cot-agencia-user">Contato da agência</label>
                  <select id="cx-cot-agencia-user" name="agencia_user_id" data-field="agencia_user_id">
                    <option value="">Selecione depois</option>
                  </select>
                </div>
                <div class="cx-drawer-field">
                  <label for="cx-cot-parceiro">Parceiro</label>
                  <select id="cx-cot-parceiro" name="id_parceiro" data-field="id_parceiro">
                    <option value="">Sem parceiro</option>
                  </select>
                </div>
                <div class="cx-drawer-field">
                  <label for="cx-cot-parceiro-user">Contato do parceiro</label>
                  <select id="cx-cot-parceiro-user" name="parceiro_user_id" data-field="parceiro_user_id">
                    <option value="">Selecione depois</option>
                  </select>
                </div>
              </div>
            </section>

            <section class="cx-drawer-section">
              <div class="cx-drawer-section-title">Briefing</div>
              <div class="cx-drawer-grid">
                <div class="cx-drawer-field cx-drawer-field-span-2">
                  <label for="cx-cot-briefing">Resumo do briefing</label>
                  <textarea id="cx-cot-briefing" name="apresentacao_dados"
                            data-field="apresentacao_dados" rows="5" maxlength="4000"
                            placeholder="Público, mensagem, entregas e restrições já conhecidas."></textarea>
                </div>
                <div class="cx-drawer-field cx-drawer-field-span-2">
                  <label for="cx-cot-briefing-file">Anexar briefing</label>
                  <input id="cx-cot-briefing-file" type="file"
                         accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.jpeg,.png">
                  <span class="cx-drawer-field-hint">Opcional. PDF, DOC, PPT, JPG ou PNG, até 10 MB.</span>
                </div>
              </div>
            </section>

            <section class="cx-drawer-section">
              <div class="cx-drawer-section-title">Orientações da proposta</div>
              <div class="cx-drawer-grid">
                <div class="cx-drawer-field">
                  <label for="cx-cot-frequencia">Frequência de impacto</label>
                  <input id="cx-cot-frequencia" type="number" min="1" step="1"
                         name="frequencia_impacto" data-field="frequencia_impacto" value="3">
                </div>
                <div class="cx-drawer-field">
                  <label for="cx-cot-valor">Valor da proposta</label>
                  <input id="cx-cot-valor" type="number" min="0" step="0.01"
                         name="valor_total" data-field="valor_total" placeholder="Calculado na montagem">
                </div>
                <div class="cx-drawer-field cx-drawer-field-span-2">
                  <label for="cx-cot-premissas">Premissas</label>
                  <textarea id="cx-cot-premissas" name="premissas" data-field="premissas"
                            rows="4" placeholder="Condições consideradas nesta proposta."></textarea>
                </div>
                <div class="cx-drawer-field cx-drawer-field-span-2">
                  <label for="cx-cot-observacoes">Observações gerais</label>
                  <textarea id="cx-cot-observacoes" name="observacoes_gerais"
                            data-field="observacoes_gerais" rows="4"
                            placeholder="Informações que precisam acompanhar a proposta."></textarea>
                </div>
              </div>
            </section>
          </div>
        </details>

        <section class="cx-drawer-section cx-agency-clients" id="cx-cot-agency-clients"
                 data-cot-media-only hidden>
          <div class="cx-agency-clients-head">
            <div>
              <div class="cx-drawer-section-title">Clientes da agência</div>
              <div class="cx-drawer-section-subtitle">Vínculos permanentes disponíveis para novas cotações.</div>
            </div>
            <span class="cx-agency-clients-count" id="cx-cot-agency-count">0</span>
          </div>
          <div class="cx-agency-clients-list" id="cx-cot-agency-list"></div>
          <button type="button" class="cx-btn cx-btn-secondary cx-agency-client-add" id="cx-cot-agency-add">
            <i class="fa-solid fa-plus" aria-hidden="true"></i>
            Adicionar cliente
          </button>
          <div class="cx-agency-client-search" id="cx-cot-agency-search" hidden>
            <label for="cx-cot-agency-search-input">Buscar cliente final</label>
            <input type="search" id="cx-cot-agency-search-input"
                   placeholder="Digite nome, cidade ou CNPJ" autocomplete="off">
            <div class="cx-agency-client-results" id="cx-cot-agency-results"></div>
          </div>
        </section>
      </main>

      <aside class="cx-cotacao-editor-side">
        <section class="cx-cot-agent" aria-labelledby="cx-cot-agent-title">
          <div class="cx-cot-agent-head">
            <span class="cx-cot-agent-mark" aria-hidden="true"><i class="fa-solid fa-sparkles"></i></span>
            <div>
              <strong id="cx-cot-agent-title">Preparar com o agente</strong>
              <span>Usa o contexto deste cliente sem salvar nada.</span>
            </div>
          </div>
          <button type="button" class="cx-cot-agent-trigger" id="cx-cot-agent-trigger">
            Sugerir ponto de partida
          </button>
          <div class="cx-cot-agent-result" id="cx-cot-agent-result" hidden aria-live="polite"></div>
        </section>

        <section class="cx-drawer-section cx-cot-control">
          <div class="cx-drawer-section-title">Controle da cotação</div>
          <div class="cx-drawer-section-subtitle">Responsabilidade, investimento e período desta proposta.</div>
          <div class="cx-drawer-grid">
            <div class="cx-drawer-field">
              <label for="cx-cot-status">Status</label>
              <select id="cx-cot-status" name="status" data-field="status">
                <option value="rascunho">Rascunho</option>
                <option value="enviada">Enviada</option>
                <option value="em-acompanhamento">Em acompanhamento</option>
                <option value="aprovada">Aprovada</option>
                <option value="rejeitada">Rejeitada</option>
                <option value="expirada">Expirada</option>
              </select>
            </div>
            <div class="cx-drawer-field">
              <label for="cx-cot-budget">Budget estimado</label>
              <input id="cx-cot-budget" type="text" inputmode="decimal"
                     autocomplete="off" placeholder="R$ 0,00">
              <input id="cx-cot-budget-value" type="hidden" name="budget_estimado"
                     data-field="budget_estimado">
            </div>
            <div class="cx-drawer-field cx-drawer-field-span-2">
              <label for="cx-cot-responsavel">Responsável comercial</label>
              <select id="cx-cot-responsavel" name="responsavel_comercial"
                      data-field="responsavel_comercial">
                <option value="">— Selecione —</option>
              </select>
            </div>
            <div class="cx-drawer-field">
              <label for="cx-cot-periodo-inicio">Início *</label>
              <input id="cx-cot-periodo-inicio" type="date" name="periodo_inicio"
                     data-field="periodo_inicio" required>
            </div>
            <div class="cx-drawer-field">
              <label for="cx-cot-periodo-fim">Fim</label>
              <input id="cx-cot-periodo-fim" type="date" name="periodo_fim"
                     data-field="periodo_fim">
            </div>
          </div>
          <p class="cx-cot-duracao" id="cx-cot-duracao" role="status" aria-live="polite">
            <strong id="cx-cot-dias-corridos">—</strong> dias corridos
            <span class="cx-cot-duracao-sep" aria-hidden="true">·</span>
            <strong id="cx-cot-dias-uteis">—</strong> dias úteis
            <span class="cx-cot-duracao-hint" id="cx-cot-duracao-hint" hidden></span>
          </p>
        </section>

        <section class="cx-drawer-section cx-drawer-note" id="cx-cot-montagem-note"
                 data-cot-media-only>
          <div class="cx-drawer-note-icon" aria-hidden="true">
            <i class="fa-solid fa-file-invoice-dollar"></i>
          </div>
          <div class="cx-drawer-note-body">
            <strong>Montagem completa</strong>
            <div>Audiência, produtos, valores detalhados, comissões e PI ficam na tela de montagem.</div>
            <a class="cx-cotacao-open-full" id="cx-cot-open-full" href="#" target="_blank"
               rel="noopener" hidden>Abrir montagem completa</a>
          </div>
        </section>
      </aside>
    </div>

  </form>
</template>
