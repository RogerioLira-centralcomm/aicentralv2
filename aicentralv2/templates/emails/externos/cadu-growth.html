<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light only"><meta name="supported-color-schemes" content="light only"><title>{{ title }}</title><style>html,body{margin:0!important;padding:0!important;background:#eef1f4!important;color:#18232c!important}table{border-spacing:0!important;border-collapse:collapse!important}.email-shell{width:600px!important}.email-card{background:#ffffff!important}.email-header{background:{{ brand.soft }}!important}.email-title{color:{{ brand.deep }}!important}.email-copy{color:#26333d!important}.email-support{color:#66717a!important}.email-footer{color:#8a939a!important}.email-cta{background:{{ brand.accent }}!important;color:#ffffff!important}.email-illustration{width:100%!important;height:auto!important}@media only screen and (max-width:620px){.email-shell{width:100%!important}.outer-pad{padding:12px 8px!important}.email-header{padding:20px!important}.email-content{padding:26px 22px 24px!important}.email-title{font-size:25px!important;line-height:1.18!important;letter-spacing:-.4px!important}.email-copy{font-size:16px!important;line-height:1.66!important}.email-support{font-size:15px!important;line-height:1.55!important}.email-cta{display:block!important;text-align:center!important;padding:14px 18px!important}.email-footer{padding:16px 22px!important}}@media (prefers-color-scheme:dark){html,body,.email-page{background:#eef1f4!important}.email-card{background:#ffffff!important}.email-copy{color:#26333d!important}.email-support{color:#66717a!important}.email-footer{color:#8a939a!important}}[data-ogsc] .email-page{background:#eef1f4!important}[data-ogsc] .email-card{background:#ffffff!important}[data-ogsc] .email-copy{color:#26333d!important}[data-ogsc] .email-support{color:#66717a!important}</style></head><body class="email-page" style="margin:0;background-color:#eef1f4;color:#18232c;font-family:Arial,sans-serif"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="#eef1f4" style="background-color:#eef1f4"><tr><td class="outer-pad" style="padding:32px 16px"><table role="presentation" class="email-shell" width="600" align="center" cellspacing="0" cellpadding="0" style="width:600px;max-width:600px"><tr><td class="email-card" bgcolor="#ffffff" style="background-color:#ffffff;border-radius:18px;overflow:hidden"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td style="padding:0"><img class="email-illustration" src="{{ header_image_url }}" alt="" width="600" border="0" style="display:block;width:100%;height:auto;border:0;outline:none;text-decoration:none"></td></tr><tr><td class="email-header" align="center" bgcolor="{{ brand.soft }}" style="padding:20px 32px;background-color:{{ brand.soft }};border-bottom:1px solid #e7eaed"><img src="{{ brand.icon_url }}" alt="Cadu {{ brand.name }}" width="48" height="48" style="display:block;margin:0 auto 9px;border:0"><div style="color:{{ brand.deep }};font-size:13px;font-weight:bold;letter-spacing:.2px">Cadu {{ brand.name }}</div></td></tr><tr><td class="email-content" style="padding:34px 38px 30px"><h1 class="email-title" style="margin:0 0 14px;color:{{ brand.deep }};font-size:30px;line-height:1.12;letter-spacing:-.7px">{{ title }}</h1><p class="email-support" style="margin:0 0 22px;color:#66717a;font-size:15px;line-height:1.6">{{ description }}</p><div class="email-copy" style="color:#26333d;font-size:16px;line-height:1.72">{{ body_html }}</div><p style="margin:30px 0 0"><a class="email-cta" href="{{ cta_url }}" style="display:inline-block;padding:13px 19px;border-radius:9px;background-color:{{ brand.accent }};color:#ffffff;font-size:14px;font-weight:bold;text-decoration:none">{{ cta_label }}</a></p></td></tr><tr><td class="email-footer" align="center" style="padding:17px 32px;border-top:1px solid #e7eaed;color:#8a939a;font-size:11px">CentralComm</td></tr></table></td></tr></table></td></tr></table></body></html>
