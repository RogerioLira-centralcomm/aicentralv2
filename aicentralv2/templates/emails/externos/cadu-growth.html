<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light only">
  <title>{{ title }}</title>
  <style>
    html,body{margin:0!important;padding:0!important;background:#eef1f4!important;color:#10213B!important;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}table{border-spacing:0!important;border-collapse:collapse!important}img{border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic}.shell{width:600px!important;max-width:600px!important}.card{background:#fff!important}.brand-band{display:block;width:100%!important;height:66px!important;object-fit:cover!important}.logo-band{background:{{ brand.soft }}!important}.footer{background:{{ brand.accent }}!important}.copy{color:#26333d!important}.muted{color:#66717a!important}.text-link{color:{{ brand.accent }}!important;text-decoration:underline!important;text-underline-offset:4px!important}@media only screen and (max-width:620px){.shell{width:100%!important}.page-pad{padding:10px 8px!important}.logo-band{padding:15px 22px!important}.body-pad{padding:30px 24px 28px!important}.title{font-size:26px!important;line-height:1.17!important;letter-spacing:-.5px!important}.muted{font-size:15px!important;line-height:1.58!important}.copy{font-size:16px!important;line-height:1.7!important}.copy p{margin-bottom:18px!important}.action-row{margin-top:26px!important}.text-link{display:inline-block!important;padding:10px 0!important;line-height:1.45!important}.footer{padding:23px 22px!important}.footer-title{font-size:16px!important;line-height:1.32!important}.brand-band{height:54px!important}}@media only screen and (max-width:380px){.body-pad{padding-left:21px!important;padding-right:21px!important}.title{font-size:24px!important}.brand-band{height:50px!important}}@media (prefers-color-scheme:dark){html,body,.page{background:#eef1f4!important}.card{background:#fff!important}.logo-band{background:{{ brand.soft }}!important}.footer{background:{{ brand.accent }}!important}.copy{color:#26333d!important}.muted{color:#66717a!important}}[data-ogsc] .page{background:#eef1f4!important}[data-ogsc] .card{background:#fff!important}[data-ogsc] .logo-band{background:{{ brand.soft }}!important}[data-ogsc] .footer{background:{{ brand.accent }}!important}
  </style>
</head>
<body class="page" style="margin:0;background:#eef1f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif">
  <table role="presentation" width="100%" bgcolor="#eef1f4"><tr><td class="page-pad" style="padding:32px 16px">
    <table role="presentation" class="shell" width="600" align="center"><tr><td class="card" bgcolor="#ffffff" style="border-radius:18px;overflow:hidden;background:#fff">
      <table role="presentation" width="100%">
        <tr><td style="padding:0"><img class="brand-band" src="{{ brand_band_url }}" width="600" height="66" alt=""></td></tr>
        <tr><td class="logo-band" align="center" bgcolor="{{ brand.soft }}" style="padding:17px 32px;background:{{ brand.soft }};border-bottom:1px solid #e7eaed"><table role="presentation" align="center"><tr><td align="center" width="52" height="52" bgcolor="#ffffff" style="width:52px;height:52px;background:#fff;border-radius:16px"><img src="{{ brand.icon_url }}" width="38" height="38" alt="{{ brand.name }}" style="display:block;width:38px;height:38px;margin:0 auto"></td></tr></table></td></tr>
        <tr><td class="body-pad" style="padding:36px 40px 34px">
          <h1 class="title" style="margin:0 0 16px;color:{{ brand.deep }};font-size:31px;line-height:1.13;letter-spacing:-.8px">{{ title }}</h1>
          <p class="muted" style="margin:0 0 24px;font-size:15px;line-height:1.6">{{ description }}</p>
          <div class="copy" style="font-size:16px;line-height:1.72">{{ body_html }}</div>
          <p class="action-row" style="margin:28px 0 0;font-size:15px;line-height:1.5"><a class="text-link" href="{{ cta_url }}" style="color:{{ brand.accent }};font-weight:bold;text-decoration:underline;text-underline-offset:4px">{{ cta_label }}</a></p>
        </td></tr>
        <tr><td class="footer" align="center" bgcolor="{{ brand.accent }}" style="padding:25px 32px;background:{{ brand.accent }};color:#ffffff">
          <p class="footer-title" style="margin:0 0 7px;color:#ffffff;font-size:17px;font-weight:bold;line-height:1.3">Continue aprendendo no Cadu.</p>
          <p style="margin:0;color:#ffffff;font-size:12px;line-height:1.5;opacity:.92">Powered by CentralComm</p>
        </td></tr>
      </table>
    </td></tr></table>
  </td></tr></table>
</body>
</html>
