<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title></head><body style="margin:0;background:#eef4f2;color:#17302c;font-family:Arial,sans-serif"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td style="padding:36px 16px"><table role="presentation" width="600" align="center" cellspacing="0" cellpadding="0" style="max-width:600px;background:#fff;border-radius:18px;overflow:hidden"><tr><td style="padding:25px 32px;background:{{ brand.deep }}"><table role="presentation" cellspacing="0" cellpadding="0"><tr><td style="padding-right:12px"><img src="{{ brand.icon_url }}" alt="{{ brand.name }}" width="34" height="34" style="display:block"></td><td><strong style="color:#fff;font-size:16px">Cadu {{ brand.name }}</strong><br><span style="color:{{ brand.signal }};font-size:11px">Auditoria de marca</span></td></tr></table></td></tr><tr><td style="padding:28px 32px 10px;text-align:center;background:#f6fbf9">{% if brand_logo_url %}<img src="{{ brand_logo_url }}" alt="Logo de {{ title }}" style="max-width:190px;max-height:72px;object-fit:contain;margin:0 auto 14px;display:block">{% endif %}<div style="font-size:34px;line-height:1">✦</div></td></tr><tr><td style="padding:20px 32px 34px"><h1 style="margin:0 0 14px;font-size:28px;line-height:1.12;letter-spacing:-.6px">{{ title }}</h1><p style="margin:0;color:#59636d;font-size:15px;line-height:1.65">{{ description }}</p>{% if audit_coverage %}<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin-top:22px;background:#f4f8f7;border-radius:12px"><tr><td style="padding:15px"><strong style="font-size:13px">Amostra da auditoria</strong><br><span style="color:#59636d;font-size:13px">{{ audit_coverage }}</span></td></tr></table>{% endif %}<p style="margin:28px 0 0"><a href="{{ cta_url }}" style="display:inline-block;padding:13px 18px;border-radius:8px;background:{{ brand.accent }};color:#fff;font-size:14px;font-weight:bold;text-decoration:none">{{ cta_label }}</a></p></td></tr><tr><td style="padding:17px 32px;border-top:1px solid #e7eaed;color:#7a838b;font-size:11px">CentralComm · Este link pede acesso à sua conta.</td></tr></table></td></tr></table></body></html>
