<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cena 4 — Ação</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1>Retângulo IAB</h1>
      <p>Still de aprovação. Quatro ou cinco cenas. Sem player.</p>
    </div>
    <p>Cena 4 — Ação · 300×250</p>
  </div>
  <main class="stage">
    <div class="layer safe" id="layer-safe"></div>
    <div class="layer key-visual" id="layer-key-visual"></div>
    <div class="layer brand" id="layer-brand"><span class="brand-mark" id="layer-brand-mark"></span>SUA MARCA</div>
    <div class="layer platform" id="layer-platform">300×250</div>
    <div class="layer copy" id="layer-copy">
      <h2 id="layer-headline">A ação</h2>
      <p id="layer-support">Um verbo só.</p>
    </div>
    <div class="layer cta" id="layer-cta">Saiba mais</div>
    <div class="layer beat" id="layer-timeline"><div class="bar"><span style="width:92%"></span></div></div>
  </main>
  <div class="note">Camadas independentes: marca, tipo, key visual e CTA.</div>
  <section class="layers">
    <h3>Camadas desta cena</h3>
    <div class="layers-grid">
      <div><span class="badge">layer</span>brand</div>
      <div><span class="badge">layer</span>key visual</div>
      <div><span class="badge">layer</span>headline</div>
      <div><span class="badge">layer</span>support</div>
      <div><span class="badge">layer</span>cta</div>
    </div>
  </section>
</div>
</body>
</html>
