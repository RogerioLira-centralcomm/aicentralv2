<section class="cx-section">
  <div class="cx-section-header mc-library-head">
    <div>
      <h2>Biblioteca de formatos</h2>
      <p>Interativos, streaming e IAB com regras, mockups e referências aprovadas.</p>
    </div>
    <div class="mc-filter-row">
      <input class="cx-input" id="mcLibrarySearch" type="search" placeholder="Buscar nome, dimensão ou mecânica">
      <select class="cx-select" id="mcLibraryCategory">
        <option value="">Todas as categorias</option>
        <option value="programatica">Programática</option>
        <option value="streaming">Streaming</option>
      </select>
    </div>
  </div>
  <div class="mc-library-layout">
    <div class="cx-table-wrap">
      <table class="cx-table">
        <thead>
          <tr>
            <th>Formato</th>
            <th>Dimensão</th>
            <th>Mecânica</th>
            <th>Engine</th>
            <th>Referências</th>
          </tr>
        </thead>
        <tbody id="mcFormatTableBody"></tbody>
      </table>
    </div>
    <aside class="mc-library-detail" id="mcLibraryDetail">
      <div class="cx-empty-state"><p>Selecione um formato para abrir sua ficha técnica.</p></div>
    </aside>
  </div>
</section>
