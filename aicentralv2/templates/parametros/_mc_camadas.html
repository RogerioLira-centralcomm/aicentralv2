<section class="mc-layers" aria-labelledby="mcLayersTitle">
  <header class="mc-layers-head">
    <div>
      <h2 id="mcLayersTitle">O still vira acetato</h2>
      <p>Duas rotas. Python recorta o pixel. Image 2 redesenha elenco e fundo. Headline, preço e CTA não saem daqui — entram no HTML da Mesa.</p>
    </div>
    <p class="mc-layers-engine" id="mcLayersEngine">Python · Image 2</p>
  </header>
  <ol class="mc-layers-tally" aria-label="Ordem do recorte">
    <li class="is-current" data-layers-step="1">Still</li>
    <li data-layers-step="2">Pessoa</li>
    <li data-layers-step="3">Tinta</li>
  </ol>
  <div class="mc-layers-board" id="mcLayersBoard">
    <div class="mc-layers-plate">
      <label class="mc-layers-drop" id="mcLayersDrop" for="mcLayersFile">
        <input id="mcLayersFile" class="mc-layers-file" type="file" accept="image/png,image/jpeg,image/webp">
        <strong>Solte o criativo no 16:9</strong>
        <span>Ou abra o still de teste. PNG, JPG ou WEBP.</span>
      </label>
      <figure class="mc-layers-frame hidden" id="mcLayersFrame">
        <img id="mcLayersPreview" alt="Still para recortar">
        <div class="mc-layers-overlay" id="mcLayersOverlay" hidden></div>
      </figure>
      <div class="mc-layers-actions">
        <button class="cx-btn cx-btn-primary" id="mcLayersRun" type="button" disabled>Python</button>
        <button class="cx-btn cx-btn-secondary" id="mcLayersImage" type="button" disabled>Image 2</button>
        <button class="cx-btn cx-btn-secondary" id="mcLayersBoth" type="button" disabled>Os dois</button>
        <button class="cx-btn cx-btn-secondary" id="mcLayersDemo" type="button">Abrir criativo de teste</button>
      </div>
    </div>
    <aside class="mc-layers-rack" aria-live="polite">
      <header class="mc-layers-rack-head">
        <h3>Acetatos</h3>
        <p class="mc-layers-field hidden" id="mcLayersField"></p>
      </header>
      <p id="mcLayersStatus">Solte um still. Rode Python, Image 2 ou os dois.</p>
      <div class="mc-layers-compare" id="mcLayersCompare">
        <section data-pack="python">
          <h4>Python</h4>
          <ol class="mc-layers-grid" id="mcLayersGridPython"></ol>
        </section>
        <section data-pack="image2">
          <h4>Image 2</h4>
          <ol class="mc-layers-grid" id="mcLayersGridImage"></ol>
        </section>
      </div>
    </aside>
  </div>
</section>
