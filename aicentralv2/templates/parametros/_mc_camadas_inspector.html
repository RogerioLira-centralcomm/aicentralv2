<section class="grid content-start gap-2 border border-stone-300 bg-white p-3" aria-label="Inspetor">
  <h3 class="m-0 text-base font-normal">Inspetor</h3>
  <p class="m-0 text-sm text-stone-500" id="mcCv2InspectorEmpty">Selecione uma camada.</p>
  <form class="hidden grid gap-2 text-sm" id="mcCv2Inspector">
    <label class="grid gap-0.5">
      <span>Nome</span>
      <input class="border border-stone-300 px-2 py-1" id="mcCv2FieldLabel" name="label" type="text">
    </label>
    <div class="grid gap-2" id="mcCv2TextWrap">
      <label class="grid gap-0.5">
        <span>Conteúdo</span>
        <textarea class="min-h-[4rem] border border-stone-300 px-2 py-1" id="mcCv2FieldText" name="text"></textarea>
      </label>
      <label class="grid gap-0.5">
        <span>Família</span>
        <select class="border border-stone-300 px-2 py-1" id="mcCv2FieldFont">
          <option value="Arial, sans-serif">Arial</option>
          <option value="Georgia, serif">Georgia</option>
          <option value="Times New Roman, serif">Times New Roman</option>
          <option value="Verdana, sans-serif">Verdana</option>
          <option value="Courier New, monospace">Courier New</option>
        </select>
      </label>
      <div class="grid grid-cols-2 gap-2">
        <label class="grid gap-0.5">
          <span>Tamanho</span>
          <input class="border border-stone-300 px-2 py-1" id="mcCv2FieldSize" max="240" min="8" name="font_size" type="number">
        </label>
        <label class="grid gap-0.5">
          <span>Peso</span>
          <input class="border border-stone-300 px-2 py-1" id="mcCv2FieldWeight" max="900" min="100" name="font_weight" step="100" type="number">
        </label>
        <label class="grid gap-0.5">
          <span>Entrelinha</span>
          <input class="border border-stone-300 px-2 py-1" id="mcCv2FieldLeading" max="2.5" min="0.7" name="line_height" step="0.05" type="number">
        </label>
        <label class="grid gap-0.5">
          <span>Tracking</span>
          <input class="border border-stone-300 px-2 py-1" id="mcCv2FieldTracking" max="1" min="-0.2" name="letter_spacing" step="0.01" type="number">
        </label>
      </div>
      <label class="grid gap-0.5">
        <span>Alinhamento</span>
        <select class="border border-stone-300 px-2 py-1" id="mcCv2FieldAlign">
          <option value="left">Esquerda</option>
          <option value="center">Centro</option>
          <option value="right">Direita</option>
          <option value="justify">Justificado</option>
        </select>
      </label>
      <label class="grid gap-0.5">
        <span>Cor</span>
        <input class="h-8 w-full border border-stone-300" id="mcCv2FieldColor" name="color" type="color">
      </label>
    </div>
    <p class="m-0" id="mcCv2FieldMeta"></p>
    <label class="flex items-center gap-2">
      <input id="mcCv2FieldVisible" name="visible" type="checkbox">
      <span>Visível</span>
    </label>
    <label class="flex items-center gap-2">
      <input id="mcCv2FieldLocked" name="locked" type="checkbox">
      <span>Bloqueada</span>
    </label>
    <label class="flex items-center gap-2">
      <input id="mcCv2FieldApproved" name="approved" type="checkbox">
      <span>Aprovada</span>
    </label>
    <div class="flex flex-wrap gap-1">
      <button class="cx-btn cx-btn-secondary cx-btn-sm" id="mcCv2Download" type="button">Baixar PNG</button>
      <button class="cx-btn cx-btn-secondary cx-btn-sm" id="mcCv2Publish" type="button">Biblioteca</button>
    </div>
  </form>
</section>
