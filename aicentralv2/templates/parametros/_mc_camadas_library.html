<aside class="grid content-start gap-3 border border-stone-300 bg-[var(--cv2-sheet)] p-3" id="mcCv2Library" aria-label="Ativos da marca">
  <h3 class="m-0 text-base font-normal">Ativos da marca</h3>
  <p class="m-0 text-sm text-stone-500" id="mcCv2LibraryNote">Publique recortes na coleção da marca. Arraste um ativo para a cena.</p>
  <label class="grid gap-0.5 text-sm">
    <span class="text-stone-500">Buscar</span>
    <input class="border border-stone-300 bg-white px-2 py-1" id="mcCv2LibrarySearch" type="search" placeholder="Nome ou tag">
  </label>
  <ul class="m-0 grid list-none gap-2 p-0 text-sm" id="mcCv2LibraryGroups">
    <li><button class="cx-btn cx-btn-ghost cx-btn-sm is-current" type="button" data-library-group="">Todos <span>0</span></button></li>
    <li><button class="cx-btn cx-btn-ghost cx-btn-sm" type="button" data-library-group="person">Pessoas <span>0</span></button></li>
    <li><button class="cx-btn cx-btn-ghost cx-btn-sm" type="button" data-library-group="product">Produtos <span>0</span></button></li>
    <li><button class="cx-btn cx-btn-ghost cx-btn-sm" type="button" data-library-group="logo">Logos <span>0</span></button></li>
    <li><button class="cx-btn cx-btn-ghost cx-btn-sm" type="button" data-library-group="badge">Selos <span>0</span></button></li>
    <li><button class="cx-btn cx-btn-ghost cx-btn-sm" type="button" data-library-group="graphic">Grafismos <span>0</span></button></li>
    <li><button class="cx-btn cx-btn-ghost cx-btn-sm" type="button" data-library-group="illustration">Ilustrações <span>0</span></button></li>
    <li><button class="cx-btn cx-btn-ghost cx-btn-sm" type="button" data-library-group="background">Fundos <span>0</span></button></li>
    <li><button class="cx-btn cx-btn-ghost cx-btn-sm" type="button" data-library-group="composition">Composições <span>0</span></button></li>
  </ul>
  <ol class="m-0 grid list-none gap-2 p-0" id="mcCv2LibraryList"></ol>
</aside>
