<aside class="cv2-library" id="mcCv2Library" aria-label="Folha da marca">
  <div class="cv2-library-head">
    <h3>Folha da marca</h3>
    <button class="cv2-icon-btn" id="mcCv2LibraryClose" type="button" aria-label="Fechar folha">
      <svg class="cv2-ico" aria-hidden="true"><use href="#cv2-close"/></svg>
    </button>
  </div>
  <label class="cv2-library-search">
    <svg class="cv2-ico" aria-hidden="true"><use href="#cv2-search"/></svg>
    <input id="mcCv2LibrarySearch" type="search" placeholder="Buscar na coleção">
  </label>
  <p class="cv2-count" id="mcCv2LibraryNote">Publique um recorte no docket.</p>
  <ul class="cv2-groups" id="mcCv2LibraryGroups">
    <li class="cv2-group is-open" data-library-group="person">
      <button class="cv2-group-toggle" type="button">Pessoas <span>0</span></button>
    </li>
    <li class="cv2-group is-open" data-library-group="product">
      <button class="cv2-group-toggle" type="button">Produtos <span>0</span></button>
    </li>
    <li class="cv2-group is-open" data-library-group="logo">
      <button class="cv2-group-toggle" type="button">Logos <span>0</span></button>
    </li>
    <li class="cv2-group is-open" data-library-group="badge">
      <button class="cv2-group-toggle" type="button">Selos <span>0</span></button>
    </li>
    <li class="cv2-group is-open" data-library-group="graphic">
      <button class="cv2-group-toggle" type="button">Grafismos <span>0</span></button>
    </li>
    <li class="cv2-group is-open" data-library-group="background">
      <button class="cv2-group-toggle" type="button">Fundos <span>0</span></button>
    </li>
    <li class="cv2-group is-open" data-library-group="composition">
      <button class="cv2-group-toggle" type="button">Composições <span>0</span></button>
    </li>
  </ul>
  <ol class="cv2-library-list" id="mcCv2LibraryList"></ol>
</aside>
