<div class="cv2-stage" id="mcCv2StageWrap">
  <div class="cv2-plate-bar">
    <div>
      <p class="cv2-file" id="mcCv2FileName">Sem criativo</p>
      <p class="cv2-meta">
        <span id="mcCv2Size">—</span>
        <span id="mcCv2Ratio">—</span>
      </p>
    </div>
    <div class="cv2-modes" role="tablist" aria-label="Modo da placa">
      <button type="button" data-stage-mode="original">Original</button>
      <button class="is-current" type="button" data-stage-mode="layers">Camadas</button>
      <button type="button" data-stage-mode="html">HTML</button>
      <button type="button" data-stage-mode="animation">Animação</button>
    </div>
    <div class="cv2-plate-tools">
      <button class="cv2-icon-btn" id="mcCv2Compare" type="button" aria-label="Levantar acetato">
        <svg class="cv2-ico is-sm" aria-hidden="true"><use href="#cv2-compare"/></svg>
      </button>
      <button class="cv2-icon-btn" id="mcCv2ZoomOut" type="button" aria-label="Reduzir">
        <svg class="cv2-ico is-sm" aria-hidden="true"><use href="#cv2-minus"/></svg>
      </button>
      <span id="mcCv2ZoomLabel">100%</span>
      <button class="cv2-icon-btn" id="mcCv2ZoomIn" type="button" aria-label="Ampliar">
        <svg class="cv2-ico is-sm" aria-hidden="true"><use href="#cv2-plus"/></svg>
      </button>
      <button class="cv2-icon-btn" id="mcCv2Undo" type="button" aria-label="Desfazer">
        <svg class="cv2-ico is-sm" aria-hidden="true"><use href="#cv2-undo"/></svg>
      </button>
      <button class="cv2-icon-btn" id="mcCv2Redo" type="button" aria-label="Refazer">
        <svg class="cv2-ico is-sm" aria-hidden="true"><use href="#cv2-redo"/></svg>
      </button>
    </div>
  </div>
  <div class="cv2-well mc-cv2-check" id="mcCv2Viewport">
    <span class="cv2-register is-nw"></span>
    <span class="cv2-register is-ne"></span>
    <span class="cv2-register is-sw"></span>
    <span class="cv2-register is-se"></span>
    <div id="mcCv2World">
      <canvas id="mcCv2Canvas" width="800" height="450"></canvas>
      <canvas class="pointer-events-none absolute inset-0" id="mcCv2Overlay" width="800" height="450"></canvas>
      <svg class="pointer-events-none absolute inset-0 h-full w-full" id="mcCv2Svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <div class="absolute inset-0" id="mcCv2Handles"></div>
    </div>
    {% include "parametros/_mc_camadas_html_stage.html" %}
    {% include "parametros/_mc_camadas_animation.html" %}
    <p class="cv2-empty" id="mcCv2Empty">Solte o criativo ou use Mapear criativo.</p>
  </div>
  <div class="cv2-mask-tools" id="mcCv2Tools" aria-label="Máscara">
    <button class="cv2-icon-btn is-current" type="button" data-tool="select" aria-label="Selecionar">
      <svg class="cv2-ico" aria-hidden="true"><use href="#cv2-eye"/></svg>
    </button>
    <button class="cv2-icon-btn" type="button" data-tool="add" aria-label="Ponto mais">
      <svg class="cv2-ico" aria-hidden="true"><use href="#cv2-point-add"/></svg>
    </button>
    <button class="cv2-icon-btn" type="button" data-tool="subtract" aria-label="Ponto menos">
      <svg class="cv2-ico" aria-hidden="true"><use href="#cv2-point-sub"/></svg>
    </button>
    <button class="cv2-icon-btn" type="button" data-tool="brush" aria-label="Pincel">
      <svg class="cv2-ico" aria-hidden="true"><use href="#cv2-brush"/></svg>
    </button>
    <button class="cv2-icon-btn" type="button" data-tool="erase" aria-label="Borracha">
      <svg class="cv2-ico" aria-hidden="true"><use href="#cv2-erase"/></svg>
    </button>
    <button class="cv2-icon-btn" type="button" data-mask-op="expand" aria-label="Expandir">
      <svg class="cv2-ico" aria-hidden="true"><use href="#cv2-plus"/></svg>
    </button>
    <button class="cv2-icon-btn" type="button" data-mask-op="contract" aria-label="Contrair">
      <svg class="cv2-ico" aria-hidden="true"><use href="#cv2-minus"/></svg>
    </button>
    <button class="cv2-icon-btn" type="button" data-mask-op="feather" aria-label="Suavizar">
      <svg class="cv2-ico" aria-hidden="true"><use href="#cv2-feather"/></svg>
    </button>
    <button class="cv2-icon-btn" type="button" data-mask-op="halo" aria-label="Tirar halo">
      <svg class="cv2-ico" aria-hidden="true"><use href="#cv2-halo"/></svg>
    </button>
  </div>
</div>
