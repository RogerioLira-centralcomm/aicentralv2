<header class="cv2-chrome">
  <div class="cv2-chrome-brand">
    <h2 id="mcCamadasV2Title">Camadas</h2>
    <label class="cv2-field">
      <span>Marca</span>
      <input id="mcCv2Brand" name="brand_id" type="text" placeholder="id da marca" value="">
    </label>
    <label class="cv2-field">
      <span>Coleção</span>
      <select id="mcCv2Collection" name="collection_id">
        <option value="">Geral</option>
      </select>
    </label>
  </div>
  <div class="cv2-chrome-actions">
    <input class="sr-only" id="mcCamadasV2File" name="file" type="file" accept="image/png,image/jpeg,image/webp">
    <button class="cv2-map" id="mcCv2Map" type="button">
      <svg class="cv2-ico" aria-hidden="true"><use href="#cv2-plus"/></svg>
      Mapear criativo
    </button>
    <button class="cv2-text-btn" id="mcCv2Export" type="button" disabled>
      <svg class="cv2-ico" aria-hidden="true"><use href="#cv2-sheet"/></svg>
      Exportar HTML
    </button>
    <button class="cv2-text-btn" id="mcCv2Clean" type="button" disabled title="Só limpa poço de foto.">
      <svg class="cv2-ico" aria-hidden="true"><use href="#cv2-well"/></svg>
      Limpar fundo
    </button>
    <button class="cv2-text-btn hidden" id="mcCv2Save" type="button" disabled>Salvar</button>
  </div>
</header>
