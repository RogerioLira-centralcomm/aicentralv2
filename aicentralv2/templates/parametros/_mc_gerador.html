<div class="mc-two-column">
  <form class="cx-section mc-form" id="mcCampaignForm">
    <div class="cx-section-header">
      <div>
        <h2>Nova campanha</h2>
        <p>Defina o brief e o limite de custo antes de montar as variações.</p>
      </div>
    </div>
    <div class="cx-section-body mc-form-grid">
      <label class="cx-field mc-span-2">
        <span class="cx-label">Cliente</span>
        <select class="cx-select" name="client_id" id="mcCampaignClient" required>
          <option value="">Carregando clientes…</option>
        </select>
        <span class="cx-help">Logo, cores e tom entram automaticamente na modelagem.</span>
      </label>
      <label class="cx-field">
        <span class="cx-label">Nome da campanha</span>
        <input class="cx-input" name="name" maxlength="200" required placeholder="Ex.: Lançamento Q4">
      </label>
      <label class="cx-field">
        <span class="cx-label">Orçamento de IA (USD)</span>
        <input class="cx-input" name="budget_usd" type="number" min="0" step="0.01" value="5.00" required>
        <span class="cx-help">Reserva prompts, imagens e roteiros desta campanha.</span>
      </label>
      <label class="cx-field mc-span-2">
        <span class="cx-label">Objetivo</span>
        <select class="cx-select" name="objective">
          <option value="">Selecione</option>
          <option>Reconhecimento de marca</option>
          <option>Consideração</option>
          <option>Conversão</option>
          <option>Lançamento</option>
          <option>Engajamento</option>
        </select>
      </label>
      <label class="cx-field mc-span-2">
        <span class="cx-label">Mensagem principal</span>
        <textarea class="cx-textarea" name="campaign_text" maxlength="12000" placeholder="O que a campanha precisa comunicar?"></textarea>
      </label>
      <label class="cx-field">
        <span class="cx-label">Chamada para ação</span>
        <input class="cx-input" name="cta_text" maxlength="1000" placeholder="Conheça agora">
      </label>
      <label class="mc-check">
        <input type="checkbox" name="show_price">
        <span>Pode exibir preço</span>
      </label>
    </div>
    <footer class="mc-form-footer">
      <span class="mc-form-status" id="mcCampaignFormStatus" aria-live="polite"></span>
      <button class="cx-btn cx-btn-primary" type="submit">
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
        Criar campanha e variação A
      </button>
    </footer>
  </form>

  <aside class="cx-section mc-identity-preview">
    <div class="cx-section-header">
      <div>
        <h2>Contexto de criação</h2>
        <p>Informações que serão combinadas no prompt.</p>
      </div>
    </div>
    <div class="cx-section-body" id="mcClientPreview">
      <div class="cx-empty-state">
        <div>
          <i class="fa-regular fa-building" aria-hidden="true"></i>
          <p>Escolha um cliente para conferir sua identidade.</p>
        </div>
      </div>
    </div>
  </aside>
</div>
