<article class="mc-placas" id="mcPlacas">
  <header class="mc-placas-rail">
    <label class="cx-field">
      <select class="cx-select" id="mcPlacasClient" aria-label="Marca">
        <option value="">Marca</option>
      </select>
    </label>
    <button class="cx-btn cx-btn-primary" type="button" id="mcPlacasBuild" disabled>Montar placas</button>
    <p class="mc-placas-offer" id="mcPlacasOffer">Escolha a marca. O kit nasce no retângulo de cada formato.</p>
    <a class="mc-placas-marcas" href="{{ url_for('parametros.modelagem_marcas') }}">Abrir Marcas</a>
  </header>

  <p class="mc-placas-status" id="mcPlacasStatus"></p>

  <section class="mc-placas-empty" id="mcPlacasEmpty">
    <p>A placa é o anúncio. Sem marca, o lote fica em branco.</p>
  </section>

  <div class="mc-placas-wall" id="mcPlacasWall" hidden></div>
</article>
