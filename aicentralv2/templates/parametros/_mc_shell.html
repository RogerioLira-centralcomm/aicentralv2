{% set mc_page = mc_page|default('hub') %}
<div class="mc-chrome">
  <a class="mc-header" href="{{ url_for('parametros.modelagem_criativos') }}">Modelagem</a>
  <nav class="mc-desk-nav" aria-label="Mesas da modelagem">
    <div class="mc-desk-nav-flow">
      <a href="{{ url_for('parametros.modelagem_marcas') }}"{% if mc_page == 'marcas' %} class="is-current" aria-current="page"{% endif %}>Marcas</a>
      <a href="{{ url_for('parametros.modelagem_extrair') }}"{% if mc_page == 'extrair' %} class="is-current" aria-current="page"{% endif %}>Extrair</a>
      <a href="{{ url_for('parametros.modelagem_preparar') }}"{% if mc_page == 'preparar' %} class="is-current" aria-current="page"{% endif %}>Preparar</a>
      <a href="{{ url_for('parametros.modelagem_produzir') }}"{% if mc_page == 'produzir' %} class="is-current" aria-current="page"{% endif %}>Produzir</a>
      <a href="{{ url_for('parametros.modelagem_desdobrar') }}"{% if mc_page == 'desdobrar' %} class="is-current" aria-current="page"{% endif %}>Desdobrar</a>
      <a href="{{ url_for('parametros.modelagem_revisao') }}"{% if mc_page == 'revisao' %} class="is-current" aria-current="page"{% endif %}>Revisar</a>
      <a href="{{ url_for('parametros.modelagem_biblioteca') }}"{% if mc_page == 'biblioteca' %} class="is-current" aria-current="page"{% endif %}>Formatos</a>
      <a href="{{ url_for('parametros.modelagem_bancada') }}"{% if mc_page == 'bancada' %} class="is-current" aria-current="page"{% endif %}>Bancada</a>
      <a href="{{ url_for('parametros.modelagem_historico') }}"{% if mc_page == 'historico' %} class="is-current" aria-current="page"{% endif %}>Histórico</a>
    </div>
    <div class="mc-desk-nav-lab">
      <a href="{{ url_for('parametros.modelagem_mesa') }}"{% if mc_page == 'mesa' %} class="is-current" aria-current="page"{% endif %}>Conceito</a>
      <a href="{{ url_for('parametros.modelagem_placas') }}"{% if mc_page == 'placas' %} class="is-current" aria-current="page"{% endif %}>Placas</a>
      <a href="{{ url_for('parametros.modelagem_trocar') }}"{% if mc_page == 'trocar' %} class="is-current" aria-current="page"{% endif %}>Trocar</a>
      <a href="{{ url_for('parametros.modelagem_design-system') }}"{% if mc_page == 'design-system' %} class="is-current" aria-current="page"{% endif %}>Design System</a>
      {% if mc_page == 'mesa' %}
      <details class="mc-desk-drop" id="mcFormatDrop">
        <summary id="mcFormatSummary">Video 15s · 1920×1080</summary>
        <div class="mc-desk-drop-menu is-formats" id="mcFormatMenu"></div>
      </details>
      {% endif %}
    </div>
  </nav>
</div>
<div id="mcPageAlert" class="cx-alert cx-alert-danger hidden" role="alert"></div>
<script>
(() => {
  const nav = document.querySelector('.mc-desk-nav');
  if (!nav) return;
  nav.querySelectorAll('details').forEach((item) => {
    item.addEventListener('toggle', () => {
      if (!item.open) return;
      nav.querySelectorAll('details').forEach((other) => {
        if (other !== item) other.removeAttribute('open');
      });
    });
  });
})();
</script>
