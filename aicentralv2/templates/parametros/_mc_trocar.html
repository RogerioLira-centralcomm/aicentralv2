<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<article class="mc-lab mc-swap" id="mcSwap">
  <section class="mc-swap-stage">
    <div class="mc-swap-drop" id="mcSwapDrop">
      <input id="mcSwapFile" type="file" accept="image/*" hidden>
      <strong>Solte a referência. O GPT Image 2 troca o anúncio e mantém o quadro.</strong>
    </div>
    <figure class="mc-swap-preview" id="mcSwapPreview" hidden>
      <img id="mcSwapImage" alt="Still trocado">
    </figure>
  </section>
  <aside class="mc-swap-side">
    <label>
      <span>Marca</span>
      <select id="mcSwapClient">
        <option value="">Marca da mesa</option>
      </select>
    </label>
    <label>
      <span>Headline</span>
      <input id="mcSwapHeadline" type="text" maxlength="80" placeholder="A linha que entra no quadro">
    </label>
    <label>
      <span>Apoio</span>
      <textarea id="mcSwapSupport" rows="2" maxlength="160" placeholder="O que a TV lê em 3 segundos"></textarea>
    </label>
    <label>
      <span>CTA</span>
      <input id="mcSwapCta" type="text" maxlength="40" placeholder="Encontre a loja">
    </label>
    <label>
      <span>O que trocar</span>
      <textarea id="mcSwapNote" rows="3" maxlength="240" placeholder="Trocar Cyrella por Vivara. Tudo em português."></textarea>
    </label>
    <p id="mcSwapStatus">Uma foto de referência basta. Sem roteiro de 15s.</p>
    <p class="mc-swap-cost" id="mcSwapCost">R$ 1,20</p>
    <button type="button" id="mcSwapRun" disabled>Trocar anúncio</button>
  </aside>
</article>
