<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualização HTML do criativo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    #mcHtmlRuntime {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .mc-html-layer {
      position: absolute;
      margin: 0;
      box-sizing: border-box;
      overflow: hidden;
    }
    img.mc-html-layer { object-fit: contain; cursor: pointer; }
    p.mc-html-layer { white-space: pre-wrap; outline: none; }
    p.mc-html-layer.is-selected { outline: 1px dashed #1f8a7a; }
  </style>
</head>
<body>
  <div id="mcHtmlRuntime" data-camadas-runtime="2.0"></div>
  <script type="module" src="{{ url_for('static', filename='js/camadas/html-runtime.js') }}?v=2"></script>
</body>
</html>
