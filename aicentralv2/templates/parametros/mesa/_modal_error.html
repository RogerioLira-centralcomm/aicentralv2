<div class="mc-run-state is-error" id="mcMesaError" hidden>
  <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
  <strong id="mcMesaErrorTitle">Não foi possível concluir</strong>
  <p id="mcMesaErrorText">Tente de novo ou escolha outro key visual.</p>
  <div class="mc-run-actions">
    <button class="cx-btn cx-btn-primary" type="button" id="mcMesaErrorRetry">Tentar novamente</button>
    <button class="cx-btn cx-btn-secondary" type="button" id="mcMesaErrorKv">Trocar key visual</button>
    <button class="cx-btn cx-btn-secondary" type="button" id="mcMesaErrorSkip">Seguir sem esta cena</button>
    <button class="cx-btn cx-btn-ghost" type="button" id="mcMesaErrorDetails">Ver detalhes técnicos</button>
  </div>
  <pre id="mcMesaErrorTech" hidden></pre>
</div>
