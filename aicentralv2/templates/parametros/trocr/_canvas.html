{% from "parametros/trocr/_icons.html" import ico %}
<section class="mc-trocr-canvas" id="mcSwapStage">
  <header class="mc-trocr-canvas-bar">
    <div class="mc-trocr-tabs" role="tablist">
      <button type="button" class="is-active" data-view="view" id="mcTrocrViewBtn">Visualização</button>
      <button type="button" data-view="compare" id="mcTrocrCompareBtn">Comparar</button>
    </div>
    <div class="mc-trocr-canvas-tools">
      <button type="button" class="mc-trocr-tool" id="mcTrocrZoomOut" aria-label="Diminuir zoom">{{ ico('minus') }}</button>
      <span class="mc-trocr-zoom" id="mcTrocrZoomLabel">100%</span>
      <button type="button" class="mc-trocr-tool" id="mcTrocrZoomIn" aria-label="Aumentar zoom">{{ ico('plus') }}</button>
      <span class="mc-trocr-tool-gap" aria-hidden="true"></span>
      <button type="button" class="mc-trocr-tool" id="mcTrocrDownload" aria-label="Download">{{ ico('download') }}</button>
      <button type="button" class="mc-trocr-tool" id="mcTrocrFullscreen" aria-label="Tela cheia">{{ ico('expand') }}</button>
    </div>
  </header>
  <p class="mc-trocr-base-meta" id="mcTrocrBaseMeta">Nenhuma versão selecionada</p>
  <div class="mc-swap-stage mc-trocr-stage" id="mcTrocrViewport" data-presentation="final">
    <div class="mc-swap-drop" id="mcSwapDrop">
      <input id="mcSwapFile" type="file" accept="image/*" hidden>
      <span class="mc-trocr-drop-ico">{{ ico('image') }}</span>
      <strong>Solte a referência</strong>
      <p>Ao enviar uma nova imagem, o OCR é executado automaticamente.</p>
    </div>
    <figure class="mc-swap-preview" id="mcSwapPreview" hidden>
      <div class="mc-trocr-frame" data-mockup="final">
        <img id="mcSwapImage" alt="Still do anúncio">
      </div>
    </figure>
    <div class="mc-trocr-compare" id="mcTrocrCompare" hidden>
      <figure>
        <figcaption id="mcTrocrCompareALabel">Original</figcaption>
        <img id="mcTrocrCompareA" alt="Versão A">
      </figure>
      <figure>
        <figcaption id="mcTrocrCompareBLabel">Atual</figcaption>
        <img id="mcTrocrCompareB" alt="Versão B">
      </figure>
    </div>
  </div>
</section>
