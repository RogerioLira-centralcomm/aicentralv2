<dialog id="mcTrocrClipCompare" class="w-[min(56rem,calc(100vw-2rem))] max-h-[90vh] overflow-y-auto rounded-lg border border-slate-200 bg-white p-0 text-slate-900 shadow-xl">
  <form method="dialog" class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
    <div>
      <h2 class="m-0 text-lg font-semibold">Comparar clipes</h2>
      <p class="m-0 text-sm text-slate-500">Dois vídeos do mesmo run, no mesmo play.</p>
    </div>
    <button type="submit" class="mc-trocr-text-cta is-muted" value="cancel">Fechar</button>
  </form>
  <div class="space-y-4 px-5 py-4">
    <div class="grid grid-cols-2 gap-3">
      <label class="cx-field">
        <span class="cx-label">Clipe A</span>
        <select class="cx-select" id="mcCompareA"></select>
      </label>
      <label class="cx-field">
        <span class="cx-label">Clipe B</span>
        <select class="cx-select" id="mcCompareB"></select>
      </label>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <video id="mcCompareVideoA" class="aspect-video w-full bg-slate-950 object-contain" playsinline controls muted></video>
      <video id="mcCompareVideoB" class="aspect-video w-full bg-slate-950 object-contain" playsinline controls muted></video>
    </div>
    <div class="flex flex-wrap gap-2">
      <button type="button" class="cx-btn cx-btn-primary" id="mcComparePlay">Play juntos</button>
      <button type="button" class="cx-btn cx-btn-secondary" id="mcComparePause">Pausar</button>
      <button type="button" class="cx-btn cx-btn-secondary" id="mcCompareRestart">Do zero</button>
    </div>
  </div>
</dialog>
