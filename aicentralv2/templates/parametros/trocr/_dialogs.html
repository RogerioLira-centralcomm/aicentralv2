<dialog class="mc-trocr-dialog" id="mcTrocrConfirm">
  <header>
    <h2 id="mcTrocrConfirmTitle">Nova troca</h2>
    <p id="mcTrocrConfirmText">A troca atual fica no histórico da marca. Começar outra?</p>
  </header>
  <footer>
    <button type="button" class="mc-trocr-text-cta is-muted" id="mcTrocrConfirmCancel">Cancelar</button>
    <button type="button" class="cx-btn cx-btn-primary cx-btn-sm" id="mcTrocrConfirmOk">Começar outra</button>
  </footer>
</dialog>

<dialog class="mc-trocr-dialog" id="mcTrocrName">
  <header>
    <h2 id="mcTrocrNameTitle">Nome da versão</h2>
    <p>O nome aparece no histórico desta troca.</p>
  </header>
  <label class="cx-field">
    <span class="cx-label">Nome</span>
    <input class="cx-input" id="mcTrocrNameInput" maxlength="80">
  </label>
  <footer>
    <button type="button" class="mc-trocr-text-cta is-muted" id="mcTrocrNameCancel">Cancelar</button>
    <button type="button" class="cx-btn cx-btn-primary cx-btn-sm" id="mcTrocrNameOk">Salvar</button>
  </footer>
</dialog>

<dialog class="mc-trocr-dialog trocr-finish-dialog" id="mcTrocrFinishDialog">
  <header>
    <h2>Finalizar este trabalho?</h2>
    <p>A versão ativa será preservada como peça final. O resumo por e-mail é enviado somente na primeira finalização do projeto.</p>
  </header>
  <figure>
    <img id="mcTrocrFinishPreview" alt="Prévia da peça final">
    <figcaption id="mcTrocrFinishAssetName">Versão ativa</figcaption>
  </figure>
  <footer>
    <button type="button" class="mc-trocr-text-cta is-muted" data-close-trocr-finish>Cancelar</button>
    <button type="button" class="cx-btn cx-btn-primary cx-btn-sm" id="mcTrocrConfirmFinish">Sim, finalizar trabalho</button>
  </footer>
</dialog>
