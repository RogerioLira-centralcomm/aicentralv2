<section class="mc-trocr-section mc-trocr-generate" data-route="image">
  <p class="mc-trocr-cost" id="mcSwapCost">Consumo calculado ao gerar</p>
  <fieldset class="mc-trocr-quality" id="mcTrocrQualityBox" hidden>
    <legend>Destino</legend>
    <label>
      <input type="radio" name="mcTrocrQuality" value="draft" checked>
      <span>
        <strong>Rascunho</strong>
      </span>
    </label>
    <label>
      <input type="radio" name="mcTrocrQuality" value="production">
      <span>
        <strong>Produção</strong>
      </span>
    </label>
  </fieldset>
  <fieldset class="mc-trocr-variation" id="mcTrocrVariationBox" hidden>
    <legend>Fluxo de edição</legend>
    <label><input type="radio" name="mcTrocrVariation" value="single" checked><span><strong>Uma edição por pedido</strong><small>Faça o próximo ajuste quando quiser</small></span></label>
  </fieldset>
  <p class="mc-trocr-reference-chain" id="mcTrocrReferenceChain">A geração usa a peça inicial e a última base aprovada.</p>
  <div class="mc-trocr-actions">
    <button class="cx-btn cx-btn-primary" type="button" id="mcSwapRun" disabled>Gerar criativo</button>
    <button class="cx-btn cx-btn-secondary" type="button" id="mcTrocrOpenBatch" disabled>Desdobrar formatos</button>
    <button class="cx-btn cx-btn-secondary" type="button" id="mcTrocrAnimateFromGenerate" disabled hidden>Gerar vídeo</button>
  </div>
  <div class="mc-trocr-scene-pack" hidden>
    <p class="mc-trocr-scene-lead">Cenas adicionais para animação.</p>
    <div class="mc-trocr-scene-actions">
      <button class="cx-btn cx-btn-secondary" type="button" id="mcTrocrScene2" disabled>Cena 2</button>
      <button class="cx-btn cx-btn-secondary" type="button" id="mcTrocrScene3" disabled>Cena 3</button>
    </div>
  </div>
  <button class="cx-btn cx-btn-secondary" type="button" id="mcTrocrDraft" hidden>Gerar rascunho</button>
</section>
