<section class="mc-trocr-section mc-trocr-generate" hidden data-route="image">
  <p class="mc-trocr-cost" id="mcSwapCost">R$ —</p>
  <fieldset class="mc-trocr-quality" id="mcTrocrQualityBox">
    <legend>Destino</legend>
    <label>
      <input type="radio" name="mcTrocrQuality" value="draft" checked>
      <span>
        <strong>Rascunho</strong>
        <small>Mais rápido. Serve para conferir se a troca pegou.</small>
      </span>
    </label>
    <label>
      <input type="radio" name="mcTrocrQuality" value="production">
      <span>
        <strong>Produção</strong>
        <small>Mais lenta e cara. Só quando a peça for para o ar.</small>
      </span>
    </label>
  </fieldset>
  <div class="mc-trocr-actions">
    <button class="cx-btn cx-btn-primary" type="button" id="mcSwapRun" disabled>Gerar rascunho</button>
  </div>
  <button class="cx-btn cx-btn-secondary" type="button" id="mcTrocrDraft" hidden>Gerar rascunho</button>
</section>
