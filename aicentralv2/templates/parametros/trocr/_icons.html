{# Ícones lineares 16px — currentColor. #}
{% macro ico(name) -%}
<svg class="mc-trocr-ico" viewBox="0 0 16 16" fill="none" aria-hidden="true">
{%- if name == 'plus' -%}
  <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
{%- elif name == 'minus' -%}
  <path d="M3.5 8h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
{%- elif name == 'download' -%}
  <path d="M8 3v7m0 0 3-3M8 10 5 7M3 13h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
{%- elif name == 'expand' -%}
  <path d="M3 6.5V3h3.5M13 6.5V3H9.5M3 9.5V13h3.5M13 9.5V13H9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
{%- elif name == 'image' -%}
  <rect x="2.5" y="3.5" width="11" height="9" rx="1.2" stroke="currentColor" stroke-width="1.5"/>
  <path d="m3.5 11 3-3 2 2 2.2-2.5 2.8 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
{%- elif name == 'check' -%}
  <path d="m3.5 8.2 3 3 6-6.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
{%- elif name == 'dots' -%}
  <circle cx="3.5" cy="8" r="1.15" fill="currentColor"/>
  <circle cx="8" cy="8" r="1.15" fill="currentColor"/>
  <circle cx="12.5" cy="8" r="1.15" fill="currentColor"/>
{%- elif name == 'rotate' -%}
  <path d="M13 8a5 5 0 1 1-1.4-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M13 2.8v3.2h-3.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
{%- endif -%}
</svg>
{%- endmacro %}
