{% from "parametros/trocr/_icons.html" import ico %}
<aside class="mc-trocr-inspector mc-swap-side" id="mcTrocrInspector">
  <div class="mc-trocr-inspector-edit" id="mcTrocrStillPanel">
    <header class="mc-trocr-inspector-head">
      <h2>Conteúdo da peça</h2>
      <button type="button" class="mc-trocr-text-cta is-muted" id="mcTrocrResetPanel">Limpar campos</button>
    </header>

    {% include "parametros/trocr/_ocr_fields.html" %}
    <details class="mc-trocr-fold trocr-parameters"><summary>Parâmetros da peça</summary>
    <section class="mc-trocr-section">
      <label class="cx-field">
        <span class="cx-label">Marca</span>
        <select class="cx-select" id="mcSwapClient">
          <option value="">Carregando marcas…</option>
        </select>
        <small class="mc-trocr-brand-hint" id="mcTrocrBrandHint">A marca guarda cada conjunto de troca. Abra o histórico para navegar.</small>
      </label>
      <label class="mc-trocr-toggle is-extra" id="mcTrocrBrandRow" hidden>
        <input type="checkbox" id="mcTrocrBrandContext">
        <span>
          <strong>Aplicar DNA nesta versão</strong>
          <small>Ligue e gere de novo para comparar com a versão sem DNA.</small>
        </span>
      </label>
    </section>

    <section class="mc-trocr-section">
      <fieldset class="mc-trocr-chips">
        <legend>Como ver no canvas</legend>
        <label><input type="radio" name="mcTrocrPresent" value="final" checked> Peça final</label>
        <label><input type="radio" name="mcTrocrPresent" value="mobile"> Mockup mobile</label>
        <label><input type="radio" name="mcTrocrPresent" value="portal"> Mockup portal</label>
        <label><input type="radio" name="mcTrocrPresent" value="ctv"> Mockup CTV</label>
      </fieldset>
      <div class="mc-trocr-viewer-picks" id="mcTrocrViewerPicks" hidden></div>
    </section>

    </details>


    <details class="mc-trocr-fold mc-trocr-prompt-fold" id="mcTrocrTechFold">
      <summary>
        <h3>Texto técnico</h3>
        <small class="mc-trocr-help">O pedido já está em O que mudar. Isto só se for colar um texto pronto.</small>
      </summary>
      <div class="mc-trocr-prompt" id="mcTrocrPromptBox">
        <div class="mc-trocr-prompt-head">
          <div class="mc-trocr-prompt-actions">
            <button type="button" class="mc-trocr-text-cta" id="mcTrocrUsePrompt">Usar este texto</button>
            <button type="button" class="mc-trocr-text-cta is-muted" id="mcTrocrEditPrompt">Editar</button>
          </div>
        </div>
        <textarea class="cx-input" id="mcTrocrPrompt" rows="5" readonly placeholder="A mesa monta o texto quando a peça for redesenhada."></textarea>
      </div>
    </details>
  </div>
</aside>
