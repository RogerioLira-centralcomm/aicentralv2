<details class="mc-trocr-section mc-trocr-fold" id="mcTrocrOcr" hidden>
  <summary>
    <h3>Ajuste da leitura</h3>
    <span class="mc-trocr-fold-signal" id="mcTrocrReadSignal" hidden></span>
    <small class="mc-trocr-help" id="mcTrocrOcrHint">A leitura preencheu o que apareceu. Preço, CTA e logo só se estiverem na peça.</small>
  </summary>
  <p class="mc-trocr-ocr-banner" id="mcTrocrOcrBanner" hidden></p>
  <p class="mc-trocr-read-kicker">Palavras</p>
  <label class="cx-field">
    <span class="cx-label">Título</span>
    <input class="cx-input" id="mcSwapHeadline" type="text" maxlength="80" placeholder="A linha que entra no quadro">
  </label>
  <label class="cx-field">
    <span class="cx-label">Apoio</span>
    <textarea class="cx-input" id="mcSwapSupport" rows="2" maxlength="160" placeholder="É de graça, entrada franca, o grito da peça"></textarea>
  </label>
  <label class="cx-field">
    <span class="cx-label">Subtítulo</span>
    <input class="cx-input" id="mcTrocrSubtitle" type="text" maxlength="80" placeholder="Linha independente das datas">
  </label>
  <div class="mc-trocr-pair">
    <label class="cx-field">
      <span class="cx-label">Datas</span>
      <input class="cx-input" id="mcTrocrDates" type="text" maxlength="80" placeholder="24, 25 e 26 de julho">
    </label>
    <label class="cx-field">
      <span class="cx-label">Local</span>
      <input class="cx-input" id="mcTrocrVenue" type="text" maxlength="80" placeholder="Mineirinho">
    </label>
  </div>
  <p class="mc-trocr-opt-add" id="mcTrocrPriceAdd">
    <button type="button" class="mc-trocr-text-cta" id="mcTrocrPriceAddBtn">Informar preço</button>
  </p>
  <label class="cx-field" id="mcTrocrPriceField" hidden>
    <span class="cx-label">Preço</span>
    <input class="cx-input" id="mcTrocrPrice" type="text" maxlength="40" placeholder="R$ 0,00">
    <small class="mc-trocr-help">Opcional. Só valor em reais.</small>
  </label>
  <p class="mc-trocr-opt-add" id="mcTrocrCtaAdd">
    <button type="button" class="mc-trocr-text-cta" id="mcTrocrCtaAddBtn">Informar CTA</button>
  </p>
  <label class="cx-field" id="mcTrocrCtaField" hidden>
    <span class="cx-label">CTA</span>
    <input class="cx-input" id="mcSwapCta" type="text" maxlength="40" placeholder="O botão da peça, se houver">
  </label>
  <label class="cx-field" id="mcTrocrCta2Field" hidden>
    <span class="cx-label">Segundo CTA</span>
    <input class="cx-input" id="mcTrocrCta2" type="text" maxlength="40" placeholder="Contratar">
  </label>
  <p class="mc-trocr-opt-add" id="mcTrocrLogoAdd">
    <button type="button" class="mc-trocr-text-cta" id="mcTrocrLogoAddBtn">Informar marca no quadro</button>
  </p>
  <label class="cx-field" id="mcTrocrLogoField" hidden>
    <span class="cx-label">Marca no quadro</span>
    <input class="cx-input" id="mcTrocrLogo" type="text" maxlength="40" placeholder="Wordmark visível, se houver">
  </label>
  <label class="cx-field">
    <span class="cx-label">Texto legal</span>
    <textarea class="cx-input" id="mcTrocrDisclaimer" rows="2" maxlength="160" placeholder="Texto legal visível na peça, se houver"></textarea>
  </label>
  {% include "parametros/trocr/_analysis.html" %}
</details>
