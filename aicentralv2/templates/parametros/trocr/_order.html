<aside class="mc-trocr-order" id="mcTrocrOrder">
  {% include "parametros/trocr/_prompt.html" %}
  <section class="mc-trocr-route-block" id="mcTrocrFeedback">
    <div class="mc-trocr-route" id="mcTrocrRoute" data-mode="image" role="status">
      <p class="mc-trocr-route-name" id="mcTrocrRouteName">Ainda sem pedido</p>
      <p class="mc-trocr-route-copy" id="mcTrocrRouteCopy">Marque o que muda ou descreva a troca.</p>
    </div>
    <div class="trocr-guidance" aria-live="polite">
      <p class="trocr-guidance-title">Antes de gerar</p>
      <p class="mc-trocr-note" id="mcTrocrBrandNote" hidden></p>
      <p class="mc-trocr-risk" id="mcTrocrRisk" hidden></p>
      <div class="mc-trocr-conflicts" id="mcTrocrConflicts" hidden>
        <ul id="mcTrocrConflictList"></ul>
        <label class="mc-trocr-confirm" id="mcTrocrConfirmRow" hidden>
          <input type="checkbox" id="mcTrocrConfirmConflicts">
          <span>Confirmar mesmo assim</span>
        </label>
      </div>
    </div>
    <label class="mc-trocr-force" id="mcTrocrForceRow" hidden>
      <input type="checkbox" id="mcTrocrForceImage">
      <span>Redesenhar a peça inteira</span>
    </label>
    <p class="mc-trocr-region-hint" id="mcTrocrRegionHint" hidden></p>
    <p class="mc-trocr-qa" id="mcTrocrQa" hidden></p>
    <p class="mc-trocr-status" id="mcSwapStatus">Uma foto de referência basta. Sem roteiro de 15s.</p>
  </section>

</aside>
