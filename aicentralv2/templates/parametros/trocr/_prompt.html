<details class="mc-trocr-section mc-trocr-fold" id="mcTrocrEditBlock" hidden>
  <summary>
    <h3>Instrução da edição</h3>
    <small class="mc-trocr-help" id="mcTrocrPromptHint">Diga o item. A rota decide se o tipo entra na foto ou se o Image 2 redesenha.</small>
  </summary>
  <label class="cx-field">
    <span class="cx-label">O que mudar</span>
    <textarea class="cx-input" id="mcSwapNote" rows="3" maxlength="500" placeholder="Diminuir o tamanho do texto principal e destacar o preço. Manter as pessoas e o fundo."></textarea>
    <small class="mc-trocr-count" id="mcTrocrNoteCount">0/500</small>
  </label>
  <div class="mc-trocr-prompt" id="mcTrocrPromptBox">
    <div class="mc-trocr-prompt-head">
      <h3>Prompt otimizado</h3>
      <div class="mc-trocr-prompt-actions">
        <button type="button" class="mc-trocr-text-cta" id="mcTrocrUsePrompt">Usar este prompt</button>
        <button type="button" class="mc-trocr-text-cta is-muted" id="mcTrocrEditPrompt">Editar</button>
      </div>
    </div>
    <textarea class="cx-input" id="mcTrocrPrompt" rows="5" readonly placeholder="O sistema monta o prompt quando o Image 2 for entrar."></textarea>
  </div>
</details>
