<section class="mc-trocr-section trocr-agent-composer" id="mcTrocrEditBlock">
  <div class="trocr-agent-heading"><span class="trocr-agent-mark" aria-hidden="true">✦</span><div><h2>Cadu <span>Agente de mídia</span></h2><p class="mc-trocr-help" id="mcTrocrPromptHint">Descreva o ajuste.</p></div></div>
  <label class="cx-field trocr-agent-input">
    <textarea class="cx-input" id="mcSwapNote" rows="4" maxlength="500" placeholder="Ex.: troque o título e mantenha o produto."></textarea>
    <small class="mc-trocr-count" id="mcTrocrNoteCount">0/500</small>
  </label>
  <div class="trocr-agent-actions">
    <input id="mcTrocrAgentFiles" type="file" accept="image/*" multiple hidden>
    <button type="button" class="mc-trocr-text-cta" id="mcTrocrAgentAttach">＋ Referência</button>
    <span id="mcTrocrAgentReference">Sem referência</span>
    <button type="button" class="cx-btn cx-btn-primary" id="mcTrocrAgentSend">Analisar pedido</button>
  </div>
  <p class="trocr-agent-shortcut sr-only">Enter envia · Shift + Enter quebra a linha</p>
  <div hidden>{% include "parametros/trocr/_preserve_alter.html" %}</div>
</section>
