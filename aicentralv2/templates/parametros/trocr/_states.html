<div class="mc-trocr-toast" id="mcTrocrToast" hidden role="status"></div>
<div class="mc-trocr-error" id="mcTrocrError" hidden>
  <strong id="mcTrocrErrorTitle">Falha ao executar OCR</strong>
  <p id="mcTrocrErrorText">Tente novamente ou edite os insumos na mão.</p>
  <div>
    <button type="button" class="cx-btn cx-btn-primary cx-btn-sm" id="mcTrocrRetry">Tentar novamente</button>
    <button type="button" class="cx-btn cx-btn-ghost cx-btn-sm" id="mcTrocrEditInputs">Editar insumos</button>
    <button type="button" class="cx-btn cx-btn-ghost cx-btn-sm" id="mcTrocrBackVersion">Voltar à versão anterior</button>
  </div>
</div>
