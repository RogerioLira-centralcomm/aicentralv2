{% from "parametros/trocr/_icons.html" import ico %}
<section class="mc-trocr-reel" id="mcTrocrReel" aria-label="Versões da troca">
  <button type="button" class="mc-trocr-reel-toggle" id="mcTrocrReelToggle" aria-expanded="true" aria-controls="mcTrocrReelBody">
    {{ ico('chevron') }}
    <span id="mcTrocrReelLabel">Nenhuma versão ainda</span>
    <b id="mcTrocrVersionCount">Nenhuma versão ainda.</b>
  </button>
  <div class="mc-trocr-reel-body" id="mcTrocrReelBody">
    <div class="mc-trocr-reel-toolbar">
      <button type="button" class="mc-trocr-text-cta" id="mcTrocrOpenHistory" disabled>Abrir histórico</button>
      <button type="button" class="mc-trocr-text-cta" id="mcTrocrNewEdit" disabled>Usar a atual como base</button>
    </div>
    <div class="mc-trocr-reel-sessions" id="mcTrocrReelSessions"></div>
    <ul class="mc-trocr-version-list" id="mcTrocrVersions"></ul>
  </div>
</section>
