<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071319">
  <title>Planejamento indisponível · Smart Planner · Centralcomm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/smart_planner_public.css') }}?v=9">
</head>
<body class="cc-plan">
  <a class="cc-skip" href="#documento">Ir para o documento</a>
  <header class="cc-top">
    <div class="cc-top-inner">
      <a class="cc-brand" href="{{ house.site }}" target="_blank" rel="noopener noreferrer">
        <img src="{{ house.logo }}" alt="{{ house.name }}" width="120" height="28">
        <span>
          <small>{{ house.label }}</small>
          <strong>Smart Planner</strong>
        </span>
      </a>
    </div>
  </header>
  <main class="cc-shell" id="documento">
    <div class="cc-void">
      <h1>Este planejamento não está no ar</h1>
      <p>{{ mensagem }}</p>
    </div>
  </main>
</body>
</html>
