<script>
const products={hub:{name:'Cadu Hub',kind:'Central operacional',color:'#009f8a',nav:[['home','Visão geral','hub'],['chat','Conversas','hub'],['grid','Projetos','hub'],['link','Integrações','integrations'],['credit','Planos e uso','plans']]},studio:{name:'Cadu Media Studio',kind:'Produção criativa',color:'#7456e8',nav:[['home','Visão geral','studio'],['grid','Biblioteca','studio'],['spark','Criar e ajustar','studio'],['link','Identidade da marca','studio']]},connect:{name:'Cadu Connect',kind:'Contas e dados',color:'#1976e9',nav:[['home','Visão geral','connect'],['link','Conexões MCP','connect'],['grid','Contas e campanhas','connect'],['credit','Importar relatórios','connect']]},skills:{name:'Cadu Skills',kind:'Documentação aberta',color:'#e87922',nav:[['book','Documentação','skills'],['spark','Habilidades','skills'],['link','Integrações','skills']]},planner:{name:'Cadu Smart Planner',kind:'Planejamento de mídia',color:'#18b978',nav:[['home','Visão geral','planner'],['grid','Planos em andamento','planner'],['spark','Novo planejamento','planner'],['link','Marcas e objetivos','planner']]}};
let active='hub'; const $=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function icon(n){return `<svg><use href="#${n}"/></svg>`}function mark(c){return `<span class="mark" style="--accent:${c}"><i class="chev"></i><i class="chev dark"></i></span>`}
function pageHead(k,title,copy,action=''){return `<div class="notice"><i></i> Protótipo de front-end · dados demonstrativos</div><div class="page-head"><div><span class="badge">${products[k].name}</span><h1>${title}</h1><p>${copy}</p></div>${action}</div>`}
const onboardingCopy={hub:[['Comece pelo contexto','Converse, retome um projeto ou conecte uma fonte. O Hub mantém organização, marca e plano no mesmo lugar.'],['Do insight à operação','Envie um planejamento ao Studio para produzir ou ao Connect para acompanhar as contas.'],['Use o que já existe','Conversas, projetos e integrações ficam acessíveis sem repetir configurações.']],studio:[['Produção em uma só superfície','A barra horizontal organiza criação, edição e recursos sem comprometer a área de trabalho.'],['Use a marca ativa','Biblioteca, tokens e ativos aprovados acompanham cada novo criativo.'],['Continue depois','Salvamento e status aparecem no chrome, não dentro do seu trabalho.']],connect:[['Conecte ou importe primeiro','Adicione uma conta via MCP ou envie o relatório que você já tem.'],['Valide a leitura','O Connect identifica campanhas, IDs e fontes antes de consolidar o painel.'],['Opere com confiança','A saúde das conexões e pendências ficam visíveis antes de impactar um relatório.']],skills:[['Documentação sem barreira','As Skills são abertas: pesquise, copie exemplos e entenda o que cada capacidade faz.'],['Parta do exemplo','Cada página mostra o contexto necessário para uma boa solicitação.'],['Volte para o trabalho','Ao autenticar no Hub, a Skill pode aproveitar marca e organização ativas.']],planner:[['Descreva o objetivo','Comece pelo desafio, não pelo canal. O Planner organiza a primeira decisão.'],['Estruture o plano','Públicos, momentos, canais e métricas aparecem em uma sequência clara.'],['Leve para a próxima etapa','Quando estiver pronto, envie o direcionamento ao Studio ou Connect.']]};

function side(){let p=products[active];$('#sidebar').innerHTML=`<div class="nav-group"><label>${p.name.toUpperCase()}</label>${p.nav.map((x,i)=>`<button class="nav-item ${i===0?'active':''}" data-view="${x[2]}">${icon(x[0])}${x[1]}</button>`).join('')}</div><div class="nav-group"><label>ECOSSISTEMA</label><button class="nav-item" data-view="ecosystem">${icon('grid')}Todas as famílias</button></div><div class="side-note"><b>${p.name}</b>${p.kind}<br><span>Mockup navegável</span></div>`;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));}
function show(v){if(!document.querySelector(`#view-${v}`))v='ecosystem';document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(`#view-${v}`).classList.add('active'); if(v!=='ecosystem'&&v!=='plans')active=v;document.documentElement.style.setProperty('--accent',v==='ecosystem'?'#009f8a':v==='plans'?products.hub.color:products[active].color);let p=v==='plans'?products.hub:products[active];$('#productName').textContent=p.name;$('#productKind').textContent=p.kind;document.body.classList.toggle('is-studio',v==='studio');side();window.scrollTo({top:0,behavior:'smooth'});}function navigate(v){if(location.hash.slice(1)===v)show(v);else location.hash=v}

List.remove('open');let nav=e.target.closest('#accountMenu [data-view]');if(nav){$('#accountMenu').classList.remove('open');navigate(nav.dataset.view)}});

$('#view-ecosystem').innerHTML=`${pageHead('hub','Um sistema. Cinco formas de avançar.','O Cadu organiza o trabalho entre estratégia, produção, dados e conhecimento — cada ambiente tem foco próprio e compartilha o mesmo contexto.')}<div class="ecosystem"><section class="ecosystem-art"><span class="badge">ECOSSISTEMA CADU</span><h2>Da pergunta ao impacto.</h2><p>Escolha o ambiente que resolve o trabalho de agora. Organização, marca e plano seguem com você.</p></section><section class="family-list">${[['hub','Cadu Hub','A central para conversar, organizar e operar.'],['studio','Media Studio','Crie, adapte e reúna ativos da marca.'],['connect','Connect','Conecte contas e transforme dados em ação.'],['skills','Skills','Conhecimento aberto para usar melhor o Cadu.'],['planner','Smart Planner','Planeje mídia a partir do objetivo.']].map(x=>`<button class="family" style="--c:${products[x[0]].color}" data-go="${x[0]}"><div class="family-mark">${mark(products[x[0]].color)}</div><h3>${x[1]}</h3><p>${x[2]}</p><span>Abrir ambiente →</span></button>`).join('')}</section></div><section class="identity-system"><h2>Assinaturas do sistema</h2><p>Na interface, o símbolo 2D é o padrão: menor, rápido e funcional. A versão 3D aparece em entrada de produto, apresentações e momentos de descoberta.</p><div class="identity-row">${[['hub','Hub','cadu-hub-3d.png'],['studio','Studio','cadu-studio-3d.png'],['connect','Connect','Conecte contas e transforme dados em ação.'],['skills','Skills','Conhecimento aberto para usar melhor o Cadu.'],['planner','Smart Planner','Planeje mídia a partir do objetivo.']].map(x=>`<div class="identity-item" style="--c:${products[x[0]].color}">${mark(products[x[0]].color)}<img src="${x[2]}" alt="Símbolo 3D do Cadu ${x[1]}"><b>Cadu ${x[1]}</b><span>Ícone 2D · selo 3D</span></div>`).join('')}</div></section>`;

ass="metric"><span>Créditos disponíveis<br><b>1.240</b></span><span class="badge">Plano Pro</span></div></div></section>`;
