<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light only">
  <title>Cadu — e-mails de growth</title>
  <style>
    :root{--ink:#10213b;--paper:#f3f6f8;--line:#d9e0e6;--muted:#64717d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.bar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,5vw)}.brand{font-weight:700;letter-spacing:-.25px}.brand small{margin-left:8px;color:var(--muted);font-size:12px;font-weight:500}.back{color:#425264;font-size:12px;text-decoration:none}.back:hover{text-decoration:underline}main{max-width:1320px;margin:auto;padding:38px 28px 52px}.intro{max-width:690px;margin:0 auto 28px;text-align:center}.intro h1{margin:0;color:var(--ink);font-size:34px;line-height:1.12;letter-spacing:-1.15px}.intro p{margin:10px auto 0;max-width:590px;color:var(--muted);font-size:14px}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}.list{background:#fff;border:1px solid var(--line);padding:8px;border-radius:12px}.list-title{padding:9px 10px 11px;color:var(--muted);font-size:11px}.email-row{display:block;width:100%;border:0;border-radius:8px;background:#fff;color:var(--ink);padding:11px 10px;text-align:left;font:inherit;cursor:pointer}.email-row:hover,.email-row.active{background:var(--tone)}.email-row b{display:block;font-size:12px;line-height:1.35}.email-row span{display:block;margin-top:3px;color:var(--muted);font-size:11px;line-height:1.35}.stage{min-height:720px;display:grid;place-items:start center;padding:48px 28px;border:1px solid var(--line);border-radius:16px;background:var(--stage)}.email{width:600px;max-width:100%;overflow:hidden;background:#fff;border:1px solid rgba(16,33,59,.08);border-radius:18px;box-shadow:0 18px 45px rgba(16,33,59,.11)}.band{display:block;width:100%;height:66px;object-fit:cover}.logo-area{display:grid;place-items:center;height:86px;background:var(--soft);border-bottom:1px solid #e5eaee}.logo-tile{display:grid;place-items:center;width:52px;height:52px;background:#fff;border-radius:16px}.logo-tile img{display:block;width:38px;height:38px;object-fit:contain}.copy{padding:37px 40px 34px}.copy h2{max-width:500px;margin:0 0 16px;font-size:31px;line-height:1.13;letter-spacing:-.85px;color:var(--ink)}.lead{margin:0 0 24px;color:#68747e;font-size:15px;line-height:1.6}.copy p:last-of-type{max-width:490px;margin:0;color:#26333d;font-size:16px;line-height:1.72}.email-link{display:inline-block;margin-top:27px;padding:9px 0;color:var(--accent);font-weight:700;font-size:15px;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}.footer{padding-top:25px;background:var(--accent);text-align:center;color:#fff}.footer b{display:block;font-size:17px;line-height:1.3}.footer span{display:block;margin:7px 0 20px;font-size:12px;opacity:.88}.footer .band{filter:saturate(.92) brightness(.92)}@media (prefers-color-scheme:dark){body{background:var(--paper)!important;color:var(--ink)!important}.bar,.list,.email{background:#fff!important}.stage{background:var(--stage)!important}.copy h2{color:var(--ink)!important}.copy p:last-of-type{color:#26333d!important}}@media(max-width:850px){main{padding:26px 16px 36px}.layout{grid-template-columns:1fr}.list{display:flex;gap:7px;overflow:auto}.list-title{display:none}.email-row{min-width:225px}.stage{padding:28px 14px;min-height:auto}}@media(max-width:620px){.bar{height:56px;padding:0 18px}.brand small{display:none}.intro h1{font-size:28px}.stage{padding:12px 8px}.email{border-radius:16px}.band{height:54px}.logo-area{height:80px}.copy{padding:30px 24px 28px}.copy h2{font-size:26px;line-height:1.17;letter-spacing:-.5px}.copy p:last-of-type{font-size:16px;line-height:1.7}.footer{padding-top:23px}.footer b{font-size:16px}.footer .band{height:54px}}@media(max-width:380px){.copy{padding-left:21px;padding-right:21px}.copy h2{font-size:24px}.band,.footer .band{height:50px}}
  </style>
</head>
<body>
  <header class="bar"><span class="brand">Cadu <small>e-mails de growth</small></span><a class="back" href="cadu-ecosystem.html">Abrir ecossistema</a></header>
  <main>
    <section class="intro"><h1>Conhecimento útil, em uma peça de leitura.</h1><p>O mockup espelha o e-mail de produção: faixa da família, marca silenciosa, conteúdo claro, ação leve e um fechamento consistente.</p></section>
    <section class="layout">
      <aside class="list" id="list"><div class="list-title">MODELOS DE E-MAIL</div></aside>
      <section class="stage" id="stage"><article class="email" id="email"></article></section>
    </section>
  </main>
  <script>
    const root='../../aicentralv2/static/images/cadu/';
    const products={
      workspace:{name:'Workspace',accent:'#007D6D',soft:'#E9F6F3',stage:'#e4f1ee'},
      studio:{name:'Media Studio',accent:'#6344CF',soft:'#F1EDFC',stage:'#edeaf8'},
      planner:{name:'Smart Planner',accent:'#087D4D',soft:'#E8F7EF',stage:'#e6f1eb'},
      connect:{name:'Connect',accent:'#1363C5',soft:'#EAF2FD',stage:'#e7eff9'},
      skills:{name:'Skills',accent:'#A94D08',soft:'#FFF2E7',stage:'#f8eee5'}
    };
    const emails=[
      ['workspace','Transforme a conversa de hoje em um plano que o time consegue executar.','O contexto já existe. Agora ele pode virar uma decisão clara.','Abra Conversas'],
      ['planner','Antes de escolher canais, entenda quem a campanha precisa alcançar.','Audiência é uma decisão que sustenta o mix — não uma etapa de preenchimento.','Explorar Audiências'],
      ['studio','Antes de editar, defina onde e como o criativo precisa performar.','Edição, vídeo e formato funcionam melhor quando respondem ao contexto certo.','Ver Formatos'],
      ['connect','Um report útil mostra o que mudou e qual decisão vem depois.','Dados só viram gestão quando ganham contexto, leitura e próximo passo.','Abrir Reports'],
      ['skills','Transforme uma boa orientação em conhecimento que o time consegue reutilizar.','Exemplos, contexto e instruções certos evitam que cada projeto recomece do zero.','Abrir Skills']
    ];
    let active=0;
    const list=document.querySelector('#list'),email=document.querySelector('#email'),stage=document.querySelector('#stage');
    function render(){
      const [family,title,lead,action]=emails[active],product=products[family];
      list.innerHTML='<div class="list-title">MODELOS DE E-MAIL</div>'+emails.map((item,index)=>'<button class="email-row '+(index===active?'active':'')+'" data-index="'+index+'" style="--tone:'+products[item[0]].soft+'"><b>'+products[item[0]].name+'</b><span>'+item[1]+'</span></button>').join('');
      stage.style.setProperty('--stage',product.stage);
      email.style.cssText='--accent:'+product.accent+';--soft:'+product.soft;
      email.innerHTML='<img class="band" src="'+root+'email/bands/'+family+'-band-v2.png" width="600" height="66" alt=""><div class="logo-area"><div class="logo-tile"><img src="'+root+'brand-icons/'+family+'-192.png" width="38" height="38" alt="'+product.name+'"></div></div><section class="copy"><h2>'+title+'</h2><p class="lead">'+lead+'</p><p>Uma orientação direta para avançar com mais contexto, sem recomeçar a decisão do zero.</p><a class="email-link" href="#preview">'+action+'</a></section><footer class="footer"><b>Continue aprendendo no Cadu.</b><span>Powered by CentralComm</span></footer>';
      document.querySelectorAll('[data-index]').forEach(button=>button.onclick=()=>{active=Number(button.dataset.index);render()});
    }
    render();
  </script>
</body>
</html>
