<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadu — E-mails de growth</title>
<style>
:root{--navy:#10213b;--paper:#f7f9fc;--line:#dce3ec;--muted:#667085;--accent:#009f8a}*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#0b0f14;font:13px/1.5 Inter,system-ui,sans-serif}.bar{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.brand{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--navy)}.brand img{width:27px;height:27px;object-fit:contain}.back{color:#536074;font-size:11px;border:1px solid var(--line);border-radius:7px;padding:7px 9px;text-decoration:none}main{max-width:1260px;margin:auto;padding:30px 20px}.intro{display:flex;justify-content:space-between;gap:25px;align-items:end;margin-bottom:20px}.intro h1{color:var(--navy);font-size:27px;letter-spacing:-.8px;margin:0}.intro p{color:var(--muted);margin:4px 0 0;max-width:620px;font-size:12px}.filter{display:flex;gap:5px;flex-wrap:wrap}.filter button{border:1px solid var(--line);background:#fff;padding:6px 8px;border-radius:99px;font-size:10px;color:#536074}.filter button.active{color:var(--accent);border-color:var(--accent);background:#fff}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px}.list{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;height:calc(100vh - 175px);min-height:530px;overflow:auto}.email-row{width:100%;border:0;background:#fff;text-align:left;border-radius:7px;padding:9px}.email-row:hover,.email-row.active{background:#f4f7fa}.email-row b{font-size:11px;color:var(--navy);display:block}.email-row span{font-size:10px;color:var(--muted);display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.preview-wrap{display:grid;place-items:start center;background:#e6ebf0;padding:22px;border:1px solid var(--line);border-radius:10px;min-height:530px}.email{background:#fff;width:min(100%,620px);box-shadow:0 8px 30px #10213b12}.email-top{padding:18px 25px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #edf0f4}.email-top img{width:28px;height:28px;object-fit:contain}.email-top span{font-size:10px;color:var(--muted)}.email-art{height:135px;background:var(--accent) center/cover no-repeat}.email-body{padding:25px}.email-body h2{font-size:22px;line-height:1.15;letter-spacing:-.6px;color:var(--navy);margin:0 0 12px}.email-body p{font-size:13px;color:#475467;margin:0;max-width:500px}.email-cta{display:inline-block;margin-top:18px;padding:9px 12px;border-radius:7px;background:var(--accent);color:#fff;text-decoration:none;font-size:11px;font-weight:750}.email-foot{padding:14px 25px;border-top:1px solid #edf0f4;color:#7b8796;font-size:10px}.meta{font-size:10px;color:var(--muted);margin-bottom:10px}@media(max-width:760px){.intro{display:block}.filter{margin-top:14px}.layout{grid-template-columns:1fr}.list{height:210px;min-height:0}.preview-wrap{padding:12px}.email-art{height:110px}}
</style>
<header class="bar"><span class="brand"><img src="brand-assets/hub/favicon-64.png" alt="">cadu / growth emails</span><a class="back" href="cadu-ecosystem.html">Abrir ecossistema</a></header>
<main><section class="intro"><div><h1>Mensagens curtas para cada momento.</h1><p>51 modelos: um e-mail de boas-vindas do ecossistema e dez variações para cada produto. Cada envio tem ilustração, título, um parágrafo e link direto para a tarefa.</p></div><div class="filter" id="filter"></div></section><section class="layout"><aside class="list" id="list"></aside><section class="preview-wrap"><article class="email" id="email"></article></section></section></main>
<script>
const products={hub:{name:'Cadu Hub',color:'#009f8a',asset:'hub',url:'https://cadu.centralcomm.media',action:'Abrir o Hub'},studio:{name:'Cadu Media Studio',color:'#7456e8',asset:'studio',url:'https://studio.centralcomm.media',action:'Abrir o Studio'},connect:{name:'Cadu Connect',color:'#1976e9',asset:'connect',url:'https://connect.centralcomm.media',action:'Abrir o Connect'},skills:{name:'Cadu Skills',color:'#e87922',asset:'skills',url:'https://skills.centralcomm.media',action:'Explorar Skills'},planner:{name:'Cadu Smart Planner',color:'#18b978',asset:'planner',url:'#planner',action:'Abrir o Planner'}};
const moments=[['Seu espaço está pronto','Comece pelo que você já sabe: <strong>um objetivo, uma marca ou uma pergunta.</strong> O restante pode ganhar forma dentro do produto.'],['Faça a primeira escolha','Uma primeira ação torna o contexto útil. <strong>Abra um projeto ou retome uma conversa</strong> para dar ao Cadu um ponto de partida.'],['Traga o que já existe','Você não precisa enviar tudo de novo. <strong>Conecte seus arquivos e referências</strong> para trabalhar com o material que a equipe já aprovou.'],['Continue de onde parou','Há um trabalho esperando contexto. <strong>Retome a última atividade</strong> e transforme o próximo passo em uma decisão clara.'],['Um sinal para revisar','Uma informação nova pode mudar o próximo passo. <strong>Veja o resumo e escolha o que precisa de atenção</strong> antes de seguir.'],['Seu contexto ficou mais forte','O Cadu encontrou materiais que ajudam no trabalho atual. <strong>Use o que já existe</strong> para evitar começar do zero.'],['Convide quem decide com você','Boas decisões têm contexto compartilhado. <strong>Adicione uma pessoa à organização</strong> e mantenha o trabalho no mesmo lugar.'],['Organize o próximo ciclo','Quando o trabalho ganha ritmo, o foco muda. <strong>Revise prioridades, uso e próximos passos</strong> para manter a operação leve.'],['Créditos e uso, sem surpresa','Seu plano acompanha o trabalho de todos os produtos. <strong>Consulte consumo e renovação</strong> antes de precisar decidir.'],['Um retorno simples','Se o momento mudou, tudo bem. <strong>Volte com uma pergunta ou um arquivo</strong> e o Cadu retoma o contexto com você.']];
const emails=[{id:'welcome',family:'all',title:'Bem-vindo ao ecossistema Cadu',body:'Você agora tem um espaço para <strong>planejar, criar, conectar dados e aprender</strong> sem perder o contexto entre produtos. Comece no Hub e escolha a ferramenta que resolve o trabalho de hoje.',asset:'hub',color:'#009f8a',url:'https://cadu.centralcomm.media',action:'Conhecer o Cadu'}];
Object.entries(products).forEach(([key,p])=>moments.forEach((m,i)=>emails.push({id:`${key}-${i+1}`,family:key,title:`${p.name}: ${m[0]}`,body:m[1],asset:p.asset,color:p.color,url:p.url,action:p.action})));
let family='all',active=0;const $=s=>document.querySelector(s);
function render(){
  const rows=emails.filter(e=>family==='all'||e.family===family);
  if(!rows.some(e=>e.id===emails[active].id))active=emails.indexOf(rows[0]);
  $('#list').innerHTML=rows.map(e=>{const index=emails.indexOf(e);return `<button class="email-row ${index===active?'active':''}" data-id="${index}"><b>${e.title}</b><span>${e.body.replace(/<[^>]+>/g,'')}</span></button>`}).join('');
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{active=+b.dataset.id;render()});
  const e=emails[active],p=e.family==='all'?products.hub:products[e.family];
  $('#email').style.setProperty('--accent',e.color);
  $('#email').innerHTML=`<div class="email-top"><img src="brand-assets/${e.asset}/favicon-64.png" alt="${p.name}"><span>${p.name}</span></div><div class="email-art" style="background-image:url('brand-assets/${e.asset}/key-visual-wide.png')"></div><div class="email-body"><div class="meta">MODELO ${String(active+1).padStart(2,'0')} · GROWTH</div><h2>${e.title}</h2><p>${e.body}</p><a class="email-cta" href="${e.url}">${e.action}</a></div><div class="email-foot">Cadu · Mais do seu amanhã</div>`;
  $('#filter').innerHTML=[['all','Todos'],...Object.entries(products).map(([k,p])=>[k,p.name])].map(x=>`<button class="${x[0]===family?'active':''}" data-family="${x[0]}">${x[1]}</button>`).join('');
  document.querySelectorAll('[data-family]').forEach(b=>b.onclick=()=>{family=b.dataset.family;render()});
}
products.hub.name='Cadu Workspace';
render();
const workspaceEmailText=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let workspaceEmailNode;while(workspaceEmailNode=workspaceEmailText.nextNode()){let parent=workspaceEmailNode.parentElement;if(parent&&parent.tagName!=='SCRIPT'&&parent.tagName!=='STYLE')workspaceEmailNode.nodeValue=workspaceEmailNode.nodeValue.replaceAll('Cadu Hub','Cadu Workspace').replace(/\bHub\b/g,'Workspace')}
</script></html>
