100%;overflow:visible;pointer-events:none}.graph path{fill:none;stroke:#1689ff;stroke-width:2}.edge-label{position:absolute;padding:3px 6px;background:#fff;border:1px solid #dfebf9;border-radius:4px;color:#657d9d;font-size:9px;white-space:nowrap;z-index:2}.node{position:absolute;z-index:2;width:100px;min-height:91px;background:white;border:1px solid #e2e8f1;border-radius:7px;box-shadow:0 3px 10px #18365613;padding:9px;display:flex;flex-direction:column;align-items:center;text-align:center}.node.selected{border-color:#1689ff;box-shadow:0 0 0 3px #1689ff20,0 3px 10px #18365613}.node .logo{width:28px;height:28px;object-fit:contain;margin:3px 0 6px}.node .logo.small{width:23px;height:23px}.node .symbol{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#e9f4ff;color:#087dff;font-size:19px;margin:3px 0 6px}.node .symbol.money{background:#e6faf0;color:#079965}.node .symbol.alert{background:#fff3e8;color:#d98514}.node .thumbnail{width:42px;height:37px;margin:3px 0 6px}.node .name{font-size:10px;font-weight:700;line-height:1.23}.node .sub{font-size:9px;color:#74839c;line-height:1.25;margin-top:3px}.node .number{font-size:16px;font-weight:750;margin-top:7px}.node .unit{font-size:9px;color:#7688a0}.node .rate{font-size:9px;color:#14764b;background:#dff7e9;border-radius:6px;padding:3px 6px;margin-top:5px}.node .rate.bad{background:#ffe8ea;color:#b52843}.node .type{font-size:9px;color:#6b7e9b;margin-top:6px}.node.analysis{min-height:128px}.node.analysis .logo,.node.analysis .symbol,.node.analysis .thumbnail{margin-bottom:4px}.node.wide{width:112px}.analytics-bottom{position:absolute;left:250px;right:20px;bottom:10px;height:76px;background:white;border:1px solid #e5ebf3;border-radius:7px;display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 2px 6px #20334c0a;z-index:3}.stat{padding:11px 15px;border-right:1px solid #e7edf5}.stat:last-child{border:0}.stat small{display:block;color:#7486a1;font-size:10px}.stat b{display:inline-block;font-size:19px;margin-top:3px}.stat em{font-style:normal;margin-left:7px;color:#138852;background:#e3f7e9;border-radius:10px;padding:2px 5px;font-size:9px}.spark{display:block;width:100%;height:17px;margin-top:1px}.spark path{stroke:#1689ff;fill:none;stroke-width:1.4}.zoom{position:absolute;z-index:4;bottom:90px;right:20px;background:white;border:1px solid #e4ebf4;border-radius:6px;color:#536987;padding:10px 14px}.modebadge{position:absolute;z-index:3;top:14px;left:260px;background:#fff;border:1px solid #e4ebf4;border-radius:5px;padding:7px 9px;color:#4e6689}.thumb-top{height:6px;background:#cde4ff;border-bottom:1px solid #a9cffc}.thumbnail{border:1px solid #d8e5f5;border-radius:3px;background:#fff;padding:3px;box-shadow:0 1px 2px #1b3b6312}.thumb-row{height:3px;margin:3px;background:#d9e4f1}.thumb-row.short{width:45%}.thumb-image{height:10px;background:linear-gradient(135deg,#c6e0ff 48%,#eff7ff 49%);margin:3px}.scenario{display:none}.scenario.active{display:block}.scenario-picker{position:fixed;z-index:9;right:305px;top:70px;display:flex;gap:2px;background:#fff;border:1px solid #dae4f0;border-radius:8px;box-shadow:0 8px 28px #17365822;padding:4px}.scenario-picker button{border:0;background:transparent;color:#5c7390;padding:9px 12px;border-radius:5px}.scenario-picker button.active{background:#eaf4ff;color:#076ddd;font-weight:700}.screen-label{font-size:9px;color:#687e9b;margin-top:3px}.filters .check{margin:9px 0;color:#5b6e8a}.filters .check:before{content:"✓";display:inline-grid;place-items:center;width:13px;height:13px;background:#1689ff;color:white;border-radius:3px;margin-right:8px}.filters .check.off:before{content:"";border:1px solid #c9d6e7;background:white}.sectionline{border-top:1px solid #e7edf5;margin:16px -16px 0;padding:15px 16px 0}.inspector-footer{margin-top:20px;color:#607797;font-size:10px;line-height:1.5}@media(max-width:1500px){.map{left:245px;right:275px}.map.monitor{left:245px}.node{width:90px}.node.wide{width:100px}}@media(max-width:900px){.app{min-wi </style></head><body><div id="root"></div><script>
const A='../../aicentralv2/static/images/';const icons={meta:A+'creative-viewers/facebook.svg',google:A+'cadu/technology-logos/google.svg',instagram:A+'creative-viewers/instagram.svg',youtube:A+'creative-viewers/youtube.svg',linkedin:A+'creative-viewers/linkedin.svg',whatsapp:A+'canais/whatsapp.svg'};
const thumb=()=>'<div class="thumbnail"><div class="thumb-top"></div><div class="thumb-row"></div><div class="thumb-image"></div><div class="thumb-row short"></div></div>';
const baseFlows={
 acquisition:{title:'Jornada de aquisição',domain:'seudominio.com',nodes:[
 ['meta',3,13,'Anúncio Meta','Campanha de prospecção','channel','meta','12,4k','sessões','↑ 12%'],['google',3,36,'Anúncio Google','Busca de produto','channel','google','8,7k','sessões','↑ 8%'],['instagram',3,59,'Instagram','Conteúdo patrocinado','channel','instagram','5,1k','sessões','↑ 24%'],['influencer',3,82,'Influenciadores','Links de parceiros','symbol','♣','2,3k','sessões','↑ 11%'],
 ['capture',24,43,'Página de captura','/materiais/guia','page',null,'28,5k','sessões','68%'],['email',42,43,'E-mail de boas-vindas','Sequência inicial','symbol','✉','12,0k','envios','68%'],['sales',61,43,'Página de vendas','/produto','page',null,'8,2k','sessões','18%'],['purchase',84,43,'Compra','Pedido confirmado','money','$','1,5k','vendas','4,8%'],
 ['webinar',42,78,'Webinar','Aula de apresentação','symbol','▶','4,1k','presenças','29%'],['offer',61,78,'Página de oferta','/oferta-especial','page',null,'2,8k','sessões','7%'],['remarketing',61,8,'Remarketing','Visitou e não comprou','symbol','↗','3,6k','sessões','↑ 1%']],
 edges:[['meta','capture'],['google','capture'],['instagram','capture'],['influencer','capture'],['capture','email'],['email','sales'],['sales','purchase'],['capture','webinar'],['webinar','offer'],['offer','purchase'],['sales','remarketing'],['remarketing','sales']]},
 b2b:{title:'Jornada B2B com handoff',domain:'seudominio.com',nodes:[
 ['linkedin',3,20,'LinkedIn Ads','Campanha decisores','channel','linkedin','6,8k','visitas','↑ 9%'],['google',3,50,'Google Ads','Busca de solução','channel','google','4,2k','visitas','↑ 17%'],['partner',3,80,'Indicação','Parceiros comerciais','symbol','♣','980','visitas','↑ 4%'],
 ['landing',22,50,'Página de solução','/solucoes/reports','page',null,'8,1k','sessões','38%'],['form',39,50,'Solicitar demonstração','Formulário de 6 campos','page',null,'2.940','leads','38%'],['score',55,50,'Qualificação MQL','Score ≥ 70','symbol','◎','1.126','MQLs','42%'],
 ['sdr',71,25,'Contato SDR','Até 1 dia útil','symbol','☏','420','contatos','61%'],['nurture',71,77,'Nutrição por e-mail','Sequência de 30 dias','symbol','✉','1.108','leads','22%'],['meeting',86,25,'Reunião realizada','Diagnóstico comercial','symbol','▣','256','reuniões','72%'],['won',91,18,'Proposta ganha','Contrato assinado','money','$','74','contratos','R$ 1,28 mi'],['lost',91,70,'Reagendar','Retorno em 14 dias','alert','↻','86','oportunidades','reentrada']],
 edges:[['linkedin','landing'],['google','landing'],['partner','landing'],['landing','form'],['form','score'],['score','sdr'],['score','nurture'],['sdr','meeting'],['meeting','won'],['meeting','lost'],['lost','nurture'],['nurture','sdr']]}
};
function nodeMarkup(n,analysis){let [id,x,y,name,sub,kind,glyph,value,unit,rate]=n;let icon=kind==='channel'?`<img class="logo" src="${icons[glyph]}" alt="">`:kind==='page'?thumb():`<span class="symbol ${kind}">${glyph}</span>`;let data=analysis?`<div class="number">${value}</div><div class="unit">${unit}</div><div class="rate ${rate==='7%'?'bad':''}">${rate}</div>`:`<div class="type">${kind==='channel'?'Origem':kind==='page'?'Página do site':kind==='money'?'Resultado':'Evento / condição'}</div>`;return `<div class="node ${analysis?'analysis':''} ${id==='sales'&&!analysis?'selected':''}" data-node="${id}" style="left:${x}%;top:${y}%;transform:translateY(-50%)">${icon}<div class="name">${name}</div><div class="sub">${sub}</div>${data}</div>`}
function palette(){return `<aside class="side left"><h2>Blocos <span>×</span></h2><div class="search">⌕ &nbsp; Buscar blocos...</div><h3>Tráfego</h3>${[['meta','Anúncio (Meta)'],['google','Anúncio (Google)'],['instagram','Instagram'],['linkedin','LinkedIn'],['youtube','YouTube']].map(([i,n])=>`<div class="paletteitem"><img src="${icons[i]}" alt="">${n}</div>`).join('')}<h3>Páginas do site</h3>${['Página','Página de vendas','Checkout'].map(x=>`<div class="paletteitem"><span class="symbol">▣</span>${x}</div>`).join('')}<h3>Formulários</h3>${['Formulário','Pop-up','Pesquisa'].map(x=>`<div class="paletteitem"><span class="symbol">▤</span>${x}</div>`).join('')}<h3>Eventos</h3>${['E-mail','SMS','Webhook'].map(x=>`<div class="paletteitem"><span class="symbol">✉</span>${x}</div>`).join('')}<h3>Resultados</h3>${['Compra','Lead qualificado','Tag CRM'].map(x=>`<div class="paletteitem"><span class="symbol">✓</span>${x}</div>`).join('')}</aside>`}
function inspector(flow){return `<aside class="side right"><h2>Propriedades <span>×</span></h2><div class="inspector-head">${thumb()}<div><strong>${flow==='acquisition'?'Página de vendas':'Solicitar demonstração'}</strong><small>Página do site</small></div></div><h3>Geral</h3><div class="label">Nome</div><div class="field">${flow==='acquisition'?'Página de vendas':'Solicitar demonstração'}</div><div class="label">URL</div><div class="field">https://seudominio.com/${flow==='acquisition'?'produto':'demo'}</div><div class="toggle">Rastrear conversões <i></i></div><h3>Aparência</h3><div class="label">Imagem</div><div class="field">Alterar miniatura da página</div><div class="label">Descrição</div><div class="field" style="height:55px">Etapa principal da jornada</div><div class="sectionline">Configurações avançadas　⌄</div><div class="sectionline">Eventos e metas　⌄</div><p class="inspector-footer">Selecione um bloco ou conexão no mapa para configurar a jornada.</p></aside>`}
function filters(){return `<aside class="side left filters"><h2>Filtros <span>×</span></h2><div class="label">Período</div><div class="select">▦ &nbsp; Últimos 30 dias　⌄</div><div class="label">Comparar com</div><div class="select">Período anterior　⌄</div><h3>Fontes de tráfego</h3>${['Todos','Meta Ads','Google Ads','Instagram','LinkedIn'].map((x,i)=>`<div class="check ${i?'off':''}">${x}</div>`).join('')}<h3>Dispositivos</h3>${['Todos','Desktop','Mobile','Tablet'].map((x,i)=>`<div class="check ${i?'off':''}">${x}</div>`).join('')}<h3>País</h3><div class="select">Todos os países　⌄</div><div class="sectionline">Mais filtros　⌄</div></aside>`}
function stats(flow){let rows=flow==='acquisition'?[['Sessões totais','28,5k','↑ 14%'],['Leads gerados','12,0k','↑ 11%'],['Vendas','1,5k','↑ 27%'],['Taxa de conversão','5,3%','↑ 18%']]:[['Visitas identificadas','12,0k','↑ 12%'],['MQLs','1.126','↑ 8%'],['Reuniões realizadas','256','↑ 19%'],['Receita atribuída','R$ 1,28 mi','↑ 21%']];return `<div class="analytics-bottom">${rows.map(r=>`<div class="stat"><small>${r[0]}</small><b>${r[1]}</b><em>${r[2]}</em><svg class="spark" viewBox="0 0 160 17"><path d="M0 15 Q12 14 20 5 T40 9 T60 6 T80 8 T100 3 T120 5 T140 2 T160 4"/></svg></div>`).join('')}</div>`}
function render(flow='acquisition',mode='editor'){let d=baseFlows[flow],analysis=mode==='analysis';document.querySelector('#root').innerHTML=`<div class="app"><header class="header"><div class="brand"><span class="brandmark"><i></i><i></i><i></i></span><span>Cadu<br>Reports</span></div><div class="breadcrumb">Fluxos　›　<strong>${d.title}</strong></div><div class="flowtitle">${d.title}</div><span class="editmark">✎</span>${analysis?`<div class="tabs"><button>Visão geral</button><button data-mode="editor">Editar</button><button class="active" data-mode="analysis">Analisar</button></div>`:''}<span class="push"></span>${analysis?'<button class="button">▦ &nbsp; Últimos 30 dias　⌄</button>':'<span class="save">☁　Salvo há 2 minutos</span>'}<div class="actions"><button class="button icon">⋯</button><button class="button">▷　Simular</button><button class="button primary">⇧　Publicar</button></div></header><nav class="rail"><button>⊞</button><button class="active">♧<small>Fluxos</small></button><button>▥</button><button>♙</button><button>⚙</button></nav><main class="workspace">${analysis?filters():palette()}<div class="canvas"><div class="modebadge">${analysis?'Análise do fluxo · eventos observados':'Construtor de fluxo · rascunho'}</div><div class="map ${analysis?'monitor':''}" id="map">${d.nodes.map(n=>nodeMarkup(n,analysis)).join('')}<svg class="graph" aria-hidden="true"></svg></div></div>${analysis?stats(flow):inspector(flow)}<div class="zoom">⊡　−　100%　＋　⛶</div></main></div><div class="scenario-picker"><button data-scenario="acquisition" class="${flow==='acquisition'?'active':''}">Aquisição</button><button data-scenario="b2b" class="${flow==='b2b'?'active':''}">Jornada B2B</button><button data-mode="editor" class="${mode==='editor'?'active':''}">Construtor</button><button data-mode="analysis" class="${mode==='analysis'?'active':''}">Análise</button></div>`;window.current={flow,mode};document.querySelectorAll('[data-scenario]').forEach(x=>x.onclick=()=>render(x.dataset.scenario,mode));document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>render(flow,x.dataset.mode));requestAnimationFrame(()=>drawEdges(d.edges))}
function drawEdges(edges){let map=document.querySelector('#map'),svg=map.querySelector('.graph'),mr=map.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${mr.width} ${mr.height}`);let paths=[];for(let [from,to] of edges){let a=map.querySelector(`[data-node="${from}"]`),b=map.querySelector(`[data-node="${to}"]`);if(!a||!b)continue;let ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();let backwards=br.left<ar.left;let x1=(backwards?ar.left:ar.right)-mr.left,y1=ar.top+ar.height/2-mr.top,x2=(backwards?br.right:br.left)-mr.left,y2=br.top+br.height/2-mr.top;let dx=Math.max(30,Math.abs(x2-x1)*.42);let track=from==='remarketing'?12:mr.height-10;let d=backwards?`M${x1} ${y1} L${x1-20} ${y1} Q${x1-38} ${y1} ${x1-38} ${track} L${x2+34} ${track} Q${x2+18} ${track} ${x2+18} ${y2} L${x2} ${y2}`:`M${x1} ${y1} C${x1+dx} ${y1},${x2-dx} ${y2},${x2} ${y2}`;paths.push(`<path d="${d}" marker-end="url(#arrow)"/>`)}svg.innerHTML='<defs><marker id="arrow" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1689ff"/></marker></defs>'+paths.join('')}
window.addEventListener('resize',()=>{if(window.current)render(window.current.flow,window.current.mode)});render();
</script></body></html>
